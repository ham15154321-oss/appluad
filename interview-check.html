<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>面談能力檢核</title>
<!-- ★ ds143（10/29 Ivan）：面談能力檢核。錄音 → 逐項比對面談流程表 → 主管錄音回饋 → 下次比對，直到達標。
     Apple Design：一頁三段、按下就回應、結果從流程帶長出來、半透明側面板不加遮罩、減少動態有替代。 -->
<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --ink2:#6E6E73; --ink3:#AEAEB2; --line:rgba(0,0,0,.08);
  --accent:#0A84FF; --good:#E24B4A; --weak:#2E9D5B; --miss:#C7C7CC; --na:#E5E5EA;
  --r:20px; --ease:cubic-bezier(.2,.9,.25,1);
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--ink);font:100%/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;color:inherit;}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 80px;}
/* 標題列 */
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.top h1{font-size:2rem;line-height:1.05;letter-spacing:-.02em;margin:0;font-weight:700;}
.top p{margin:4px 0 0;color:var(--ink2);font-size:.9375rem;}
.top .sp{flex:1;}
.seg{display:inline-flex;background:rgba(118,118,128,.12);border-radius:10px;padding:2px;}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-size:.875rem;font-weight:600;color:var(--ink2);cursor:pointer;transition:background .2s var(--ease),color .2s;}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:.9375rem;font-weight:600;cursor:pointer;transition:transform .1s ease-out,background .15s;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.pri:disabled{background:#B9D7FB;border-color:#B9D7FB;cursor:not-allowed;}
.btn.rec{background:#FF3B30;border-color:#FF3B30;color:#fff;}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 8px;}
.btn.sm{min-height:32px;padding:0 12px;font-size:.8125rem;}
/* 卡片 */
.card{background:var(--card);border-radius:var(--r);padding:22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);}
.step{display:flex;align-items:center;gap:10px;margin:0 0 14px;}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.8125rem;font-weight:700;flex:none;}
.step h2{font-size:1.1875rem;margin:0;letter-spacing:-.01em;}
.step .hint{margin-left:auto;font-size:.8125rem;color:var(--ink2);}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.fld{display:flex;flex-direction:column;gap:4px;flex:1;min-width:180px;}
.fld label{font-size:.75rem;color:var(--ink2);font-weight:600;letter-spacing:.02em;}
.in{height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#FAFAFC;outline:none;transition:border-color .15s,box-shadow .15s;}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,132,255,.15);background:#fff;}
textarea.in{height:auto;min-height:96px;padding:10px 12px;line-height:1.6;resize:vertical;}
.drop{margin-top:12px;border:1.5px dashed rgba(0,0,0,.15);border-radius:16px;padding:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#FAFAFC;}
.drop .files{flex:1;min-width:160px;font-size:.875rem;color:var(--ink2);}
.prog{margin-top:14px;display:none;}
.prog .bar{height:6px;border-radius:3px;background:rgba(0,0,0,.06);overflow:hidden;}
.prog .bar b{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .4s var(--ease);}
.prog .tx{font-size:.875rem;color:var(--ink2);margin-top:6px;}
.prog.err .tx{color:#C0392B;font-weight:600;}
/* 這位業務 */
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.who h3{margin:0;font-size:1.25rem;letter-spacing:-.01em;}
.badge{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.06);color:var(--ink2);}
.badge.pass{background:rgba(226,75,74,.12);color:var(--good);}
.spark{width:100%;height:72px;margin:10px 0 4px;}
.hist{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer;transition:background .15s;font-size:.9375rem;}
.hrow:hover{background:rgba(0,0,0,.035);} .hrow:active{transform:scale(.99);}
.hrow.on{background:rgba(10,132,255,.08);}
.hrow .d{color:var(--ink2);font-size:.8125rem;width:92px;flex:none;font-variant-numeric:tabular-nums;}
.hrow .s{font-weight:700;width:48px;font-variant-numeric:tabular-nums;}
.hrow .m{color:var(--ink2);font-size:.8125rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.todo{margin:10px 0 0;padding:12px 14px;border-radius:14px;background:#FFF8E6;font-size:.9375rem;}
.todo b{display:block;font-size:.8125rem;color:#8A6100;margin-bottom:4px;}
.todo ol{margin:0;padding-left:20px;}
/* 結果 */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.score .n{font-size:3.25rem;line-height:1;letter-spacing:-.03em;font-weight:700;font-variant-numeric:tabular-nums;}
.score .u{font-size:1rem;color:var(--ink2);font-weight:600;}
.score .dl{font-size:.9375rem;font-weight:700;}
.score .dl.up{color:var(--good);} .score .dl.dn{color:var(--weak);}
.meta{font-size:.8125rem;color:var(--ink2);margin-top:4px;}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0 6px;position:relative;}
.pill{position:relative;border:0;border-radius:16px;padding:12px 10px 10px;text-align:left;cursor:pointer;background:#F2F2F7;transition:transform .1s ease-out,box-shadow .2s;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;}
.pill:active{transform:scale(.97);}
.pill .k{font-size:.8125rem;font-weight:700;color:var(--ink2);}
.pill .v{font-size:1.375rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.pill .bar{height:4px;border-radius:2px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:6px;}
.pill .bar b{display:block;height:100%;border-radius:2px;}
.pill.hit{background:rgba(226,75,74,.08);} .pill.hit .v{color:var(--good);} .pill.hit .bar b{background:var(--good);}
.pill.low .v{color:var(--weak);} .pill.low .bar b{background:var(--weak);}
.pill.none .v{color:var(--ink3);}
.pill.sel{box-shadow:0 0 0 2px var(--ink) inset;}
.pill::after{content:"";position:absolute;right:-6px;top:50%;width:4px;height:4px;border-top:2px solid var(--ink3);border-right:2px solid var(--ink3);transform:translateY(-50%) rotate(45deg);}
.pill:last-child::after{display:none;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8125rem;color:var(--ink2);margin-top:8px;}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0;}
.dot.good{background:var(--good);} .dot.weak{background:var(--weak);} .dot.miss{background:var(--miss);} .dot.na{background:#fff;border:1.5px solid var(--miss);}
.sum{margin-top:14px;font-size:1rem;line-height:1.65;}
.prevck{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
.prevck div{font-size:.9375rem;padding:8px 12px;border-radius:12px;background:#F7F7FA;}
.empty{color:var(--ink2);font-size:.9375rem;padding:6px 0;}
/* 回饋 */
.fbout{margin-top:12px;}
/* 側面板（半透明、不加遮罩、從流程帶長出來） */
.sheet{position:fixed;top:16px;right:16px;height:calc(100vh - 32px);width:min(460px,calc(100vw - 32px));z-index:50;border-radius:24px;
  background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.7);box-shadow:0 24px 80px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.9);
  display:flex;flex-direction:column;opacity:0;transform:scale(.92);filter:blur(6px);pointer-events:none;
  transition:opacity .3s var(--ease),transform .38s var(--ease),filter .3s var(--ease);}
.sheet.show{opacity:1;transform:none;filter:none;pointer-events:auto;}
.sh-head{display:flex;align-items:center;gap:10px;padding:18px 18px 10px;}
.sh-head h3{margin:0;font-size:1.25rem;letter-spacing:-.01em;}
.sh-head .x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.06);cursor:pointer;font-size:15px;}
.sh-head .x:active{transform:scale(.94);}
.sh-body{flex:1;min-height:0;overflow:auto;padding:0 18px 18px;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 10px);mask-image:linear-gradient(180deg,transparent 0,#000 10px);}
.it{padding:12px 0;border-bottom:1px solid var(--line);}
.it:last-child{border-bottom:0;}
.it .h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9375rem;}
.it .st{margin-left:auto;font-size:.75rem;font-weight:700;color:var(--ink2);}
.it .q{margin-top:6px;font-size:.875rem;line-height:1.6;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.035);}
.it .q em{font-style:normal;color:var(--ink2);font-size:.75rem;margin-right:6px;font-variant-numeric:tabular-nums;}
.it .w{margin-top:4px;font-size:.8125rem;color:var(--ink2);}
.it .c{margin-top:4px;font-size:.75rem;color:var(--ink3);}
.star{border:0;background:transparent;cursor:pointer;font-size:.8125rem;color:var(--ink2);padding:4px 0;margin-top:4px;}
.star.on{color:#C98A00;font-weight:700;}
/* 對話框（檢核表、用量：需要專注 → 加遮罩） */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;}
.dim.show{opacity:1;pointer-events:auto;}
.dlg{position:fixed;left:50%;top:50%;width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px);z-index:61;background:#fff;border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.25);
  display:flex;flex-direction:column;opacity:0;transform:translate(-50%,-48%) scale(.96);pointer-events:none;transition:opacity .25s var(--ease),transform .32s var(--ease);}
.dlg.show{opacity:1;transform:translate(-50%,-50%);pointer-events:auto;}
.dlg .sh-body{-webkit-mask-image:none;mask-image:none;flex:0 1 auto;}
.dlg-foot{display:flex;gap:10px;padding:12px 18px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center;}
.stg{margin:14px 0 6px;font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;}
.erow{display:grid;grid-template-columns:150px 1fr 32px;gap:8px;margin-bottom:8px;align-items:start;}
.erow .in{height:38px;font-size:.875rem;}
.erow textarea.in{min-height:38px;height:38px;font-size:.8125rem;padding:8px 10px;}
.erow .del{width:32px;height:38px;border:0;background:transparent;color:var(--ink3);cursor:pointer;font-size:16px;}
table.use{width:100%;border-collapse:collapse;font-size:.875rem;font-variant-numeric:tabular-nums;}
table.use th,table.use td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;}
table.use th:first-child,table.use td:first-child{text-align:left;}
table.use th{font-size:.75rem;color:var(--ink2);font-weight:600;}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
.txwrap{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;}
.tx-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;} .tx-head b{font-size:1.0625rem;}
.tx{display:flex;flex-direction:column;gap:2px;}
.tx-h{margin:14px 0 4px;font-size:.75rem;font-weight:700;color:var(--ink2);letter-spacing:.04em;}
.tx-r{display:grid;grid-template-columns:52px 44px 1fr;gap:8px;padding:5px 8px;border-radius:10px;font-size:.9375rem;line-height:1.65;transition:background .3s;}
.tx-r .tt{color:var(--ink3);font-size:.75rem;font-variant-numeric:tabular-nums;padding-top:3px;}
.tx-r .who{font-weight:700;font-size:.875rem;color:var(--ink2);} .tx-r .who.a{color:var(--accent);}
.tx-r.hl{background:#FFF3C4;}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);background:rgba(29,29,31,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:.9375rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s var(--ease);z-index:80;max-width:calc(100vw - 32px);}
.toast.show{opacity:1;transform:translateX(-50%);}
.toast.err{background:#C0392B;}
@media (max-width:720px){
  .wrap{padding:18px 14px 80px;}
  .top h1{font-size:1.625rem;}
  .strip{grid-template-columns:repeat(3,1fr);}
  .pill::after{display:none;}
  .sheet{top:auto;left:0;right:0;bottom:0;width:100%;height:auto;max-height:82vh;border-radius:24px 24px 0 0;transform:translateY(40px);}
  .erow{grid-template-columns:1fr 32px;} .erow textarea.in{grid-column:1/2;}
}
@media (prefers-reduced-motion:reduce){
  .sheet,.dlg,.toast,.btn,.pill,.prog .bar b{transition:opacity .2s ease !important;transform:none !important;filter:none !important;}
  .dlg{transform:translate(-50%,-50%) !important;} .toast{transform:translateX(-50%) !important;}
}
@media (prefers-reduced-transparency:reduce){ .sheet{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none;} }
@media (prefers-contrast:more){ .card,.pill,.sheet{border:1px solid rgba(0,0,0,.4);} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>面談能力檢核</h1><p>錄音上傳後，逐項比對面談流程表：有沒有講到、講得好不好</p></div>
    <div class="sp"></div>
    <div class="seg" id="regSeg" role="tablist" aria-label="區域"></div>
    <button class="btn" onclick="openEditor()">📋 檢核表</button><button class="btn" id="setBtn" hidden onclick="openSettings()">⚙ 設定</button>
  </div>

  <!-- ① 上傳 -->
  <section class="card" id="cardUp">
    <div class="step"><i>1</i><h2>上傳面談錄音</h2><span class="hint">業務自己上傳就是自評</span></div>
    <div class="row">
      <div class="fld"><label for="rep">誰的面談</label><input class="in" id="rep" list="repList" placeholder="輸入業務名字" autocomplete="off" oninput="onRepChange()"><datalist id="repList"></datalist></div>
      <div class="fld"><label for="ivTitle">標題（選填）</label><input class="in" id="ivTitle" placeholder="例如：1029 晚上 小美 面談"></div>
    </div>
    <div class="drop">
      <input type="file" id="ivFile" accept="audio/*,.m4a,.mp3,.wav,.ogg,.aac,.webm" multiple hidden onchange="pickFiles(this.files)">
      <button class="btn" onclick="document.getElementById('ivFile').click()">📁 選擇錄音檔</button>
      <button class="btn" id="ivRecBtn" onclick="toggleRec('iv')">🎙 現場錄音</button>
      <div class="files" id="ivFiles">還沒選檔。可以一次選好幾段，會接起來一起分析</div>
      <button class="btn pri" id="ivGo" disabled onclick="runInterview()">開始檢核</button>
    </div>
    <div class="prog" id="ivProg"><div class="bar"><b></b></div><div class="tx"></div></div>
  </section>

  <!-- 這位業務 -->
  <section class="card" id="cardWho" hidden>
    <div class="who"><h3 id="whoName"></h3><span class="badge" id="whoBadge"></span><span class="sp" style="flex:1"></span><span class="meta" id="whoMeta"></span></div>
    <svg class="spark" id="spark" viewBox="0 0 600 64" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div id="whoTodo"></div>
    <div class="hist" id="hist"></div>
  </section>

  <!-- ② 結果 -->
  <section class="card" id="cardRes" hidden>
    <div class="step"><i>2</i><h2>檢核結果</h2><span class="hint">點流程帶看每一項的原話</span></div>
    <div class="score"><span class="n" id="resN">–</span><span class="u">/ 100</span><span class="dl" id="resD"></span></div>
    <div class="meta" id="resMeta"></div>
    <div class="strip" id="strip"></div>
    <div class="legend"><span><i class="dot good"></i>講得好</span><span><i class="dot weak"></i>講了但不到位</span><span><i class="dot miss"></i>沒講到</span><span><i class="dot na"></i>未錄到／不適用（不算分）</span></div>
    <div class="sum" id="resSum"></div>
    <div id="resPrev"></div>
    <div id="resNext"></div>
    <div id="resTx" class="txwrap"></div>
  </section>

  <!-- ③ 主管回饋 -->
  <section class="card" id="cardFb" hidden>
    <div class="step"><i>3</i><h2>主管回饋</h2><span class="hint">錄音或打字都可以，會整理成下次要注意的 3 件事</span></div>
    <div class="row">
      <button class="btn" id="fbRecBtn" onclick="toggleRec('fb')">🎙 錄回饋</button>
      <input type="file" id="fbFile" accept="audio/*,.m4a,.mp3,.wav,.webm" hidden onchange="pickFb(this.files)">
      <button class="btn" onclick="document.getElementById('fbFile').click()">📁 上傳回饋錄音</button>
      <span class="meta" id="fbFileName"></span>
    </div>
    <textarea class="in" id="fbText" style="margin-top:10px;" placeholder="或直接打字：這次哪裡好、哪裡要改、下次一定要做到什麼"></textarea>
    <div class="row" style="margin-top:10px;"><button class="btn pri" id="fbGo" onclick="runFeedback()">整理成下次要注意</button></div>
    <div class="prog" id="fbProg"><div class="bar"><b></b></div><div class="tx"></div></div>
    <div class="fbout" id="fbOut"></div>
  </section>

  <div class="foot"><button class="btn ghost" onclick="openUsage()">📊 本月用量</button><button class="btn ghost" onclick="openStars()">⭐ 好講法範例</button><button class="btn ghost" onclick="exportXlsx()">⬇ 匯出試算表</button></div>
</div>

<!-- 側面板：某一階段的逐項結果 -->
<aside class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-label="逐項結果">
  <div class="sh-head"><h3 id="shTitle"></h3><button class="x" onclick="closeSheet()" aria-label="關閉">✕</button></div>
  <div class="sh-body" id="shBody"></div>
</aside>

<!-- 對話框 -->
<div class="dim" id="dim" onclick="closeDlg()"></div>
<div class="dlg" id="dlg" role="dialog" aria-modal="true">
  <div class="sh-head"><h3 id="dlgTitle"></h3><button class="x" onclick="closeDlg()" aria-label="關閉">✕</button></div>
  <div class="sh-body" id="dlgBody"></div>
  <div class="dlg-foot" id="dlgFoot"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════════ 基本 ═══════════════ */
var PROXY_BASE='https://anthropic-proxy.ivanapplaud.workers.dev';
var MODELS={ opus:{id:'claude-opus-4-7',name:'Opus（最準）',in:5,out:25}, sonnet:{id:'claude-sonnet-4-6',name:'Sonnet（建議）',in:3,out:15}, haiku:{id:'claude-haiku-4-5-20251001',name:'Haiku（最省）',in:1,out:5} };
var USD_TWD=32, WHISPER_USD_HR=0.111, CHUNK_SEC=600;
var DEFAULT_VOCAB='赫綵、赫綵設計學院、OKbom、Wacom、Mac、乙級、簡章、課綱、作品集、含金量、赫綵三寶、十字理財、金三角、報名費、契約書、遠東、綠界、遠信、仲信、裕富、註冊包、排課、體驗券、Photoshop、Illustrator、Procreate、平面設計、商業攝影、室內設計、動畫、漫畫';
var ADMIN_NAME='黃柏翰';
var PASS_SCORE=80, PASS_STREAK=2;
var REGIONS=['桃區','中區','南區'];
var CL_KEY='iv_checklist_v1';            // 全公司共用（firebase-sync 已列入共享名單）

function hgLoad(){
  if(_hgReady) return _hgReady;

    try{ var r=indexedDB.open('SpaceBaseDB');

async function transcribe(blob, offsetSec){

  var vocab=(getSet().vocab||'').trim(); if(vocab) fd.append('prompt','以下是繁體中文的設計學院業務對話，會出現：'+vocab.slice(0,400));
  var r=await xfetch(PROXY_BASE+'/groq/audio/transcriptions',{method:'POST',body:fd},300000);
  if(!r.ok){ var t=''; try{t=await r.text();}catch(_){} throw new Error('轉文字失敗（'+r.status+'）'+t.slice(0,120)); }
  var d=await r.json(); var segs=(d&&d.segments)||null;
  if(!segs||!segs.length) return (d&&d.text)?('['+mmss(offsetSec||0)+'] '+d.text):'';
  return segs.map(function(sg){ return '['+mmss((sg.start||0)+(offsetSec||0))+'] '+String(sg.text||'').trim(); }).filter(function(l){ return l.length>8; }).join('\n');
}
async function transcribeFile(file,label,progId,p0,p1){
  setProg(progId,'壓縮音檔'+label,p0);
  var c=await compress(file,function(p){ setProg(progId,'壓縮音檔'+label+' '+Math.round(p*100)+'%',null); });
  var parts=[], base=_txOffset;
  for(var i=0;i<c.chunks.length;i++){
    setProg(progId,'轉逐字稿'+label+' 第 '+(i+1)+'/'+c.chunks.length+' 段',p0+(p1-p0)*(i+1)/c.chunks.length);
    var t=''; try{ t=await transcribe(c.chunks[i].blob, base+c.chunks[i].offset); }catch(e){ try{ t=await transcribe(c.chunks[i].blob, base+c.chunks[i].offset); }catch(e2){ t='['+mmss(base+c.chunks[i].offset)+'] （這 10 分鐘轉文字失敗：'+(e2&&e2.message||e2)+'）'; } }
    parts.push(t);
  }
  _txOffset+=c.sec; return { text:parts.join('\n'), sec:c.sec };
}
var _txOffset=0;
async function askAI(system, user, maxTok, modelKey){
  var m=MODELS[modelKey]||MODELS.opus;
  var r=await xfetch(PROXY_BASE+'/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:m.id,max_tokens:maxTok||4000,system:system,messages:[{role:'user',content:user}]})},300000);
  if(!r.ok){ var t=''; try{t=await r.text();}catch(_){} throw new Error('AI 失敗（'+r.status+'）'+t.slice(0,120)); }
  var d=await r.json(); var txt=(d&&d.content&&d.content[0]&&d.content[0].text)||'';
  return { text:txt, usage:{ in:(d.usage&&d.usage.input_tokens)||0, out:(d.usage&&d.usage.output_tokens)||0 } };
}
// ★ ds145 排版：分說話者、加標點、分段、掛階段標題。不刪字、不摘要。每 2500 字一段送，兩段並行
async function formatTranscript(raw, labels, stageNames, onProg){
  var set=getSet(), lines=String(raw||'').split('\n'), chunks=[], cur='';
  lines.forEach(function(l){ if(cur.length+l.length>2500 && cur){ chunks.push(cur); cur=''; } cur+=l+'\n'; }); if(cur.trim()) chunks.push(cur);
  var sys='你是逐字稿排版員。輸入是一段'+labels[0]+'和'+labels[1]+'對話的語音轉文字（每行 [mm:ss] 開頭，可能有同音錯字）。請排版成對話：'
    +'\n1. 判斷每句是誰說的，只能用「'+labels.join('」「')+'」「其他」。'
    +'\n2. 加上正確標點；同一個人連續的話合併成一段，段首保留第一句的時間。'
    +'\n3. 一個字都不能刪、不能摘要、不能改意思；只修明顯的同音錯字（專有名詞：'+String(set.vocab||'').slice(0,300)+'）。'
    +'\n4. 話題轉到下列階段時，先輸出一行「## 階段名」：'+stageNames.join('、')+'。'
    +'\n只輸出排版結果，每段一行，格式：[mm:ss] 說話者｜內容';
  var outs=new Array(chunks.length), usage={in:0,out:0}, done=0, idx=0;
  async function worker(){ while(idx<chunks.length){ var k=idx++; var r=await askAI(sys,chunks[k],8000,set.fModel); outs[k]=r.text.trim(); usage.in+=r.usage.in; usage.out+=r.usage.out; done++; if(onProg) onProg(done,chunks.length); } }
  await Promise.all([worker(),worker()]);
  return { text:outs.join('\n'), usage:usage };
}
function parseFmt(t){ var rows=[]; String(t||'').split('\n').forEach(function(l){ l=l.trim(); if(!l) return; var h=l.match(/^#+\s*(.+)$/); if(h){ rows.push({h:h[1]}); return; }
  var m=l.match(/^\[(\d+:\d+)\]\s*([^｜|:：]{1,6})[｜|:：]\s*(.*)$/); if(m){ rows.push({t:m[1],who:m[2].trim(),x:m[3]}); return; }
  var m2=l.match(/^\[(\d+:\d+)\]\s*(.*)$/); if(m2){ rows.push({t:m2[1],who:'',x:m2[2]}); return; } rows.push({t:'',who:'',x:l}); }); return rows; }
function parseJSON(t){ var a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a<0||b<a) throw new Error('AI 回傳格式不對，請再按一次'); return JSON.parse(t.slice(a,b+1)); }
async function notifyTG(text){ try{ await xfetch(PROXY_BASE+'/telegram/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.slice(0,3900)})},30000); }catch(e){ console.warn('[iv] Telegram 失敗',e); } }
function setProg(id,msg,pct,err){ var p=$(id); p.style.display='block'; p.classList.toggle('err',!!err); p.querySelector('.tx').textContent=msg; if(pct!=null) p.querySelector('.bar b').style.width=pct+'%'; }

var _rec=null, _recChunks=[], _recFor='', _recT0=0, _recTimer=null;
async function toggleRec(forWhat){
  if(_rec && _rec.state==='recording'){ _rec.stop(); return; }
  try{
    var stream=await navigator.mediaDevices.getUserMedia({audio:true});
    _recChunks=[]; _recFor=forWhat; _rec=new MediaRecorder(stream);
    _rec.ondataavailable=function(e){ if(e.data&&e.data.size) _recChunks.push(e.data); };
    _rec.onstop=function(){
      stream.getTracks().forEach(function(t){ t.stop(); }); clearInterval(_recTimer);
      var type=(_recChunks[0]&&_recChunks[0].type)||'audio/webm'; var ext=/mp4/.test(type)?'m4a':'webm';
      var f=new File(_recChunks,'現場錄音_'+fmtD(Date.now()).replace(/[\/: ]/g,'')+'.'+ext,{type:type});
      var btn=$(forWhat==='iv'?'ivRecBtn':'fbRecBtn'); btn.classList.remove('rec'); btn.textContent=forWhat==='iv'?'🎙 現場錄音':'🎙 錄回饋';
      if(forWhat==='iv') pickFiles([f]); else pickFb([f]);
    };
    _rec.start(1000); _recT0=Date.now();
    var btn=$(forWhat==='iv'?'ivRecBtn':'fbRecBtn'); btn.classList.add('rec');
    var tick=function(){ btn.textContent='■ 停止 '+mmss((Date.now()-_recT0)/1000); }; tick(); _recTimer=setInterval(tick,1000);
  }catch(e){ toast('沒辦法開麥克風：'+(e&&e.message||e)+'（可以改用「選擇錄音檔」）',true); }
}

function buildStarsText(cl){

  try{ LSW().setItem(CL_KEY,JSON.stringify(o)); pushCloudSoon(); toast('設定已存'); closeDlg(); }catch(e){ toast('沒存成功：'+(e&&e.message||e),true); } }
function testSheet(){ var u=$('setU').value.trim(); if(!u){ toast('先貼上 Apps Script 網址',true); return; }
  fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:$('setK').value.trim(),head:{'連線測試':['時間','誰','訊息']},sheets:{'連線測試':[[tsStr(Date.now()),ME(),'面談檢核連線測試']]}})}).then(function(){ toast('已送出，去試算表看有沒有多一個「連線測試」分頁'); },function(e){ toast('送不出去：'+(e&&e.message||e),true); }); }
/* ═══════════════ ③ 主管回饋 ═══════════════ */
var _fbFile=null;
function pickFb(files){ if(!files||!files.length) return; _fbFile=files[0]; $('fbFileName').textContent='已選：'+_fbFile.name; }
function renderFbOut(rec){
  var f=fbFor(rec.id);
  $('fbOut').innerHTML=f?('<div class="todo" style="background:#EEF6FF"><b>主管回饋（'+esc(f.by)+'・'+fmtD(f.createdAt)+'）→ 下次要注意</b><ol>'+(f.ivf.next||[]).map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+'</ol>'
    +(f.ivf.fbText?('<div class="meta" style="margin-top:6px;white-space:pre-wrap">'+esc(f.ivf.fbText.slice(0,600))+(f.ivf.fbText.length>600?'…':'')+'</div>'):'')+'</div>'):'';
}
async function runFeedback(){
  var rec=_curRec; if(!rec){ toast('先在上面選一次面談紀錄',true); return; }
  if(_busy) return; _busy=true; $('fbGo').disabled=true;
  try{
    var text=$('fbText').value.trim(), audioSec=0;
    if(_fbFile){ await ensureLame(); _txOffset=0; var tf=await transcribeFile(_fbFile,'（回饋）','fbProg',10,50); audioSec=tf.sec||0; text=(tf.text.replace(/\[\d+:\d+\]\s*/g,'')+(text?('\n'+text):'')).trim(); }
    if(!text) throw new Error('請錄一段回饋、上傳錄音，或打幾句字');
    setProg('fbProg','整理成下次要注意的 3 件事…',60);
    var iv=rec.iv, cl=clFor(rec);
    var sys='你是赫綵設計學院的面談教練助理。根據主管對業務的口頭回饋，加上這次面談檢核結果，整理出「下次面談要注意的 3 件事」：每件一句、動詞開頭、具體到下次面談能直接照做、能被下次錄音檢查（例如「報價前先講完赫綵三寶」）。以主管的意思為主，檢核結果只當參考。只輸出 JSON：{"next":["…","…","…"],"brief":"主管回饋重點一句 50 字內"}';
    var user='業務：'+iv.rep+'\n這次分數：'+scoreOf(rec)+'\n沒講到：'+missNames(cl,itemsOf(rec)).join('、')+'\nAI 總評：'+(iv.summary||'')+'\n\n主管回饋（可能有同音錯字）：\n'+text.slice(0,20000);
    var set=getSet(), ai=await askAI(sys,user,1200,set.aModel), res=parseJSON(ai.text);
    var now=Date.now();
    var fb={ id:'ivf_'+now, type:'interview_fb', by:ME(), createdAt:now, text:'🗣 主管回饋｜'+iv.rep+'｜'+(res.brief||'')+'\n下次要注意：'+(res.next||[]).join('；'),
      ivf:{ ivId:rec.id, rep:iv.rep, next:res.next||[], brief:res.brief||'', fbText:text, usage:{ in:ai.usage.in, out:ai.usage.out, aModel:set.aModel, audioSec:Math.round(audioSec) } } };
    await caseWrite([fb]); sheetPush('fb',fb);
    setProg('fbProg','完成',100);
    await notifyTG('🗣 主管回饋｜'+iv.rep+'（'+ME()+'）\n'+(res.brief||'')+'\n下次要注意：\n'+(res.next||[]).map(function(p,i){ return (i+1)+'. '+p; }).join('\n'));
    _fbFile=null; $('fbFile').value=''; $('fbFileName').textContent=''; $('fbText').value='';
    renderResult(rec); renderWho(); toast('已存，下次檢核會逐條比對');
  }catch(e){ console.error('[iv]',e); setProg('fbProg','沒完成：'+(e&&e.message||e),null,true); }
  _busy=false; $('fbGo').disabled=false;
}

/* ═══════════════ 對話框：檢核表編輯、用量、好講法 ═══════════════ */
function openDlg(title,body,foot){ $('dlgTitle').textContent=title; $('dlgBody').innerHTML=body; $('dlgFoot').innerHTML=foot||''; $('dim').classList.add('show'); $('dlg').classList.add('show'); }
function closeDlg(){ $('dim').classList.remove('show'); $('dlg').classList.remove('show'); }
var _ed=null;
function canEdit(){ return ME()===ADMIN_NAME; }
function openEditor(){
  var cl=getCL(REGION); var ro=!canEdit();
  if(!cl){ openDlg(REGION+' 檢核表','<p class="empty">'+REGION+' 還沒有自己的檢核表，目前先用桃區的。</p>', canEdit()?'<button class="btn pri" onclick="copyTY()">複製桃區當起點</button>':'<span class="meta">請柏翰建立</span>'); return; }
  _ed=JSON.parse(JSON.stringify(cl));
  renderEditor(ro);
}
function renderEditor(ro){
  var h='<p class="meta">'+REGION+'・v'+(_ed.ver||1)+(_ed.updatedBy?('・最後修改 '+esc(_ed.updatedBy)+' '+fmtD(_ed.updatedAt)):'')+(ro?'・只有柏翰可以修改':'・「判定標準」寫得越具體，AI 判得越準')+'</p>';
  _ed.stages.forEach(function(s,si){
    h+='<div class="stg">'+(si+1)+'. '+(ro?esc(s.name):'<input class="in" style="height:34px;max-width:220px" value="'+esc(s.name)+'" onchange="_ed.stages['+si+'].name=this.value">')+'</div>';
    s.items.forEach(function(it,ii){
      h+=ro?('<div class="it"><div class="h">'+esc(it.name)+'</div><div class="c">'+esc(it.crit||'')+'</div></div>')
        :('<div class="erow"><input class="in" value="'+esc(it.name)+'" onchange="_ed.stages['+si+'].items['+ii+'].name=this.value"><textarea class="in" onchange="_ed.stages['+si+'].items['+ii+'].crit=this.value">'+esc(it.crit||'')+'</textarea><button class="del" title="刪除" onclick="_ed.stages['+si+'].items.splice('+ii+',1);renderEditor(false)">✕</button></div>');
    });
    if(!ro) h+='<button class="btn sm" onclick="addItem('+si+')">＋ 新增項目</button>';
  });
  openDlg('📋 '+REGION+' 檢核表',h, ro?'':'<button class="btn pri" onclick="saveEditor()">儲存（v'+((_ed.ver||1)+1)+'）</button><span class="meta">儲存後新的檢核才會用新版，舊紀錄的分數不變</span>');
}
function addItem(si){ var s=_ed.stages[si]; s.items.push({id:s.id+'i'+Date.now().toString(36),name:'新項目',crit:''}); renderEditor(false); }
function saveEditor(){
  if(!canEdit()) return; var o=loadCL(); _ed.ver=(_ed.ver||1)+1; _ed.updatedAt=Date.now(); _ed.updatedBy=ME(); o.regions[REGION]=_ed;
  try{ LSW().setItem(CL_KEY,JSON.stringify(o)); toast('檢核表已存（v'+_ed.ver+'），全公司同步'); closeDlg(); pushCloudSoon(); }catch(e){ toast('沒存成功：'+(e&&e.message||e),true); }
}
function copyTY(){ if(!canEdit()) return; var o=loadCL(); var c=JSON.parse(JSON.stringify(o.regions['桃區'])); c.ver=1; c.updatedAt=Date.now(); c.updatedBy=ME(); o.regions[REGION]=c;
  try{ LSW().setItem(CL_KEY,JSON.stringify(o)); closeDlg(); openEditor(); pushCloudSoon(); }catch(e){ toast('沒存成功：'+(e&&e.message||e),true); } }
function openUsage(){
  var m0=new Date(); m0.setDate(1); m0.setHours(0,0,0,0); var t0=m0.getTime(), by={}, judged=0, ovr=0;
  _cases.forEach(function(c){ if(!c||(c.createdAt||0)<t0||!hgCanSee(c)) return;
    if(c.type==='interview_ovr'){ ovr++; return; }
    var u=(c.iv&&c.iv.usage)||(c.ivf&&c.ivf.usage)||(c.ivx&&c.ivx.usage); if(!u) return; var who=c.by||'?'; var b=by[who]=by[who]||{n:0,f:0,sec:0,tok:0,ntd:0};
    if(c.type==='interview'){ b.n++; judged+=Object.keys(c.iv.items||{}).length; } else if(c.type==='interview_fb') b.f++;
    b.sec+=u.audioSec||0; b.tok+=(u.in||0)+(u.out||0)+(u.fin||0)+(u.fout||0); b.ntd+=ntd(u); });
  var rows=Object.keys(by).sort(function(a,b){ return by[b].ntd-by[a].ntd; }), tot=0; rows.forEach(function(k){ tot+=by[k].ntd; });
  var h=rows.length?('<table class="use"><tr><th>誰按的</th><th>檢核</th><th>回饋</th><th>錄音分鐘</th><th>token</th><th>約 NT$</th></tr>'+rows.map(function(k){ var b=by[k]; return '<tr><td>'+esc(k)+'</td><td>'+b.n+'</td><td>'+b.f+'</td><td>'+Math.round(b.sec/60)+'</td><td>'+b.tok.toLocaleString()+'</td><td>'+Math.round(b.ntd)+'</td></tr>'; }).join('')+'<tr><td><b>合計</b></td><td></td><td></td><td></td><td></td><td><b>'+Math.round(tot)+'</b></td></tr></table>'
    +'<p class="meta" style="margin-top:10px">AI 改判率（主管不同意 AI 的比例）：'+(judged?(Math.round(ovr/judged*1000)/10+'%（'+ovr+'／'+judged+' 項）'):'—')+'。越低代表 AI 越懂你們的標準。</p><p class="meta">台幣是用單價估的，以帳單為準；只算這台電腦已經同步到、我看得到的紀錄。</p>'):'<p class="empty">這個月還沒有人用。</p>';
  openDlg('📊 '+(m0.getMonth()+1)+' 月用量',h,'');
}
function openStars(){
  var st=starListMine(REGION);
  var h=st.length?st.slice().reverse().map(function(s){ return '<div class="it"><div class="h">'+esc(s.ivs.itemName)+'<span class="st">'+esc(s.ivs.rep)+'・'+esc(s.by)+' 標</span></div><div class="q">'+esc(s.ivs.quote)+'</div></div>'; }).join(''):'<p class="empty">還沒有範例。在檢核結果裡，覺得哪句講得好就按「☆ 設為好講法範例」，AI 之後會拿它當標準。</p>';
  openDlg('⭐ '+REGION+' 好講法範例（'+st.length+'）',h,'');
}

/* ═══════════════ 區域、名單、啟動 ═══════════════ */
function renderSeg(){ $('regSeg').innerHTML=REGIONS.map(function(r){ return '<button role="tab" class="'+(r===REGION?'on':'')+'" aria-selected="'+(r===REGION)+'" onclick="setRegion(\''+r+'\')">'+r+(getCL(r)||r==='桃區'?'':'＊')+'</button>'; }).join(''); }
function setRegion(r){ REGION=r; try{ localStorage.setItem('iv_pref_region',r); }catch(e){} renderSeg(); if(!getCL(r)) toast(r+' 還沒有自己的檢核表，先用桃區的'); }
function fillRepList(){
  var names={}, me=ME(); if(me) names[me]=1;
  var mem=hgMembers();   // ★ ds144 名單只列同組
  try{ JSON.parse(localStorage.getItem('castle_cards_v1')||'[]').forEach(function(c){ if(c&&c.name&&c.active!==false&&(!mem||mem[c.name])) names[c.name]=1; }); }catch(e){}
  if(mem) Object.keys(mem).forEach(function(n){ names[n]=1; });
  ivRecords().forEach(function(r){ names[r.iv.rep]=1; });
  $('repList').innerHTML=Object.keys(names).map(function(n){ return '<option value="'+esc(n)+'">'; }).join('');
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if($('dlg').classList.contains('show')) closeDlg(); else closeSheet(); } });
window.addEventListener('message',function(e){ if(e.data&&e.data.action==='characterSwitched'){ if(!$('rep').value.trim()||$('rep').value===e.data.prev) $('rep').value=ME(); renderWho(); } });
// 雲端拉到別人的新紀錄（父頁 firebase-sync 拉完會發事件）→ 重讀案例庫、重畫，不用重開頁
try{ (window.parent||window).addEventListener('firebase-sync-updated',function(){ if(_busy) return; bootCases().then(function(){ fillRepList(); renderWho(); if(_curRec){ var r=_cases.find(function(c){ return c.id===_curRec.id; }); if(r){ _curRec=r; renderResult(r); } } }); }); }catch(e){}
window.triggerSave=function(){};   // 父頁切換主角時會呼叫；這頁每一步都即時存，不用另外存
(async function(){
  renderSeg(); if(canEdit()) $('setBtn').hidden=false; await bootCases(); try{ await hgLoad(); }catch(e){} fillRepList();
  var me=ME(); if(me) $('rep').value=me; onRepChange();
  var last=ivRecords(me).slice(-1)[0]; if(last){ _curRec=last; renderWho(); renderResult(last); }
})();
</script>
