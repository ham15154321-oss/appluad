<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>會議作戰追蹤</title>
<script src="./ai-ledger.js?v=14c2d9f8"></script>
<!-- ★ ds146（10/29 Ivan）：會議作戰追蹤。會前資料包 → 開會 → 貼錄音或文字 → AI 排記錄＋抽說好的事 → 組長確認 → 綁數字自動對帳 → 下次會前。
     沿用面談檢核的版面與案例庫；Apple Design：一次只出現一顆主按鈕、數字放在說好的事旁邊、AI 只給草稿、改判留紀錄、減少動態有替代。 -->
<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --ink2:#6E6E73; --ink3:#AEAEB2; --line:rgba(0,0,0,.08);
  --accent:#0A84FF; --good:#E24B4A; --weak:#2E9D5B; --miss:#C7C7CC; --na:#E5E5EA;
  --r:20px; --ease:cubic-bezier(.2,.9,.25,1);
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}   /* ★ .btn／.fld 有 display，hidden 屬性要強制生效，不然只給柏翰的按鈕大家都看得到 */
html,body{margin:0;background:var(--bg);color:var(--ink);font:100%/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;color:inherit;}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 80px;}
/* 標題列 */
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.top h1{font-size:2rem;line-height:1.05;letter-spacing:-.02em;margin:0;font-weight:700;}
.top p{margin:4px 0 0;color:var(--ink2);font-size:.9375rem;}
.top .sp{flex:1;}
.seg{display:inline-flex;background:rgba(118,118,128,.12);border-radius:10px;padding:2px;}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-size:.875rem;font-weight:600;color:var(--ink2);cursor:pointer;transition:background .2s var(--ease),color .2s;}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:.9375rem;font-weight:600;cursor:pointer;transition:transform .1s ease-out,background .15s;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.pri:disabled{background:#B9D7FB;border-color:#B9D7FB;cursor:not-allowed;}
.btn.rec{background:#FF3B30;border-color:#FF3B30;color:#fff;}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 8px;}
.btn.sm{min-height:32px;padding:0 12px;font-size:.8125rem;}
/* 卡片 */
.card{background:var(--card);border-radius:var(--r);padding:22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);}
.step{display:flex;align-items:center;gap:10px;margin:0 0 14px;}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.8125rem;font-weight:700;flex:none;}
.step h2{font-size:1.1875rem;margin:0;letter-spacing:-.01em;}
.step .hint{margin-left:auto;font-size:.8125rem;color:var(--ink2);}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.fld{display:flex;flex-direction:column;gap:4px;flex:1;min-width:180px;}
.fld label{font-size:.75rem;color:var(--ink2);font-weight:600;letter-spacing:.02em;}
.in{height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#FAFAFC;outline:none;transition:border-color .15s,box-shadow .15s;}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,132,255,.15);background:#fff;}
textarea.in{width:100%;height:auto;min-height:96px;padding:10px 12px;line-height:1.6;resize:vertical;}
.drop{margin-top:12px;border:1.5px dashed rgba(0,0,0,.15);border-radius:16px;padding:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#FAFAFC;}
.drop .files{flex:1;min-width:160px;font-size:.875rem;color:var(--ink2);}
.prog{margin-top:14px;display:none;}
.prog .bar{height:6px;border-radius:3px;background:rgba(0,0,0,.06);overflow:hidden;}
.prog .bar b{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .4s var(--ease);}
.prog .tx{font-size:.875rem;color:var(--ink2);margin-top:6px;}
.prog.err .tx{color:#C0392B;font-weight:600;}
/* 這位業務 */
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.who h3{margin:0;font-size:1.25rem;letter-spacing:-.01em;}
.badge{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.06);color:var(--ink2);}
.badge.pass{background:rgba(226,75,74,.12);color:var(--good);}
.spark{width:100%;height:72px;margin:10px 0 4px;}
.hist{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer;transition:background .15s;font-size:.9375rem;}
.hrow:hover{background:rgba(0,0,0,.035);} .hrow:active{transform:scale(.99);}
.hrow.on{background:rgba(10,132,255,.08);}
.hrow .d{color:var(--ink2);font-size:.8125rem;width:92px;flex:none;font-variant-numeric:tabular-nums;}
.hrow .s{font-weight:700;width:48px;font-variant-numeric:tabular-nums;}
.hrow .m{color:var(--ink2);font-size:.8125rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.todo{margin:10px 0 0;padding:12px 14px;border-radius:14px;background:#FFF8E6;font-size:.9375rem;}
.todo b{display:block;font-size:.8125rem;color:#8A6100;margin-bottom:4px;}
.todo ol{margin:0;padding-left:20px;}
/* 結果 */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.score .n{font-size:3.25rem;line-height:1;letter-spacing:-.03em;font-weight:700;font-variant-numeric:tabular-nums;}
.score .u{font-size:1rem;color:var(--ink2);font-weight:600;}
.score .dl{font-size:.9375rem;font-weight:700;}
.score .dl.up{color:var(--good);} .score .dl.dn{color:var(--weak);}
.meta{font-size:.8125rem;color:var(--ink2);margin-top:4px;}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0 6px;position:relative;}
.pill{position:relative;border:0;border-radius:16px;padding:12px 10px 10px;text-align:left;cursor:pointer;background:#F2F2F7;transition:transform .1s ease-out,box-shadow .2s;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;}
.pill:active{transform:scale(.97);}
.pill .k{font-size:.8125rem;font-weight:700;color:var(--ink2);}
.pill .v{font-size:1.375rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.pill .bar{height:4px;border-radius:2px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:6px;}
.pill .bar b{display:block;height:100%;border-radius:2px;}
.pill.hit{background:rgba(226,75,74,.08);} .pill.hit .v{color:var(--good);} .pill.hit .bar b{background:var(--good);}
.pill.low .v{color:var(--weak);} .pill.low .bar b{background:var(--weak);}
.pill.none .v{color:var(--ink3);}
.pill.sel{box-shadow:0 0 0 2px var(--ink) inset;}
.pill::after{content:"";position:absolute;right:-6px;top:50%;width:4px;height:4px;border-top:2px solid var(--ink3);border-right:2px solid var(--ink3);transform:translateY(-50%) rotate(45deg);}
.pill:last-child::after{display:none;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8125rem;color:var(--ink2);margin-top:8px;}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0;}
.dot.good{background:var(--good);} .dot.weak{background:var(--weak);} .dot.miss{background:var(--miss);} .dot.na{background:#fff;border:1.5px solid var(--miss);}
.sum{margin-top:14px;font-size:1rem;line-height:1.65;}
.prevck{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
.prevck div{font-size:.9375rem;padding:8px 12px;border-radius:12px;background:#F7F7FA;}
.empty{color:var(--ink2);font-size:.9375rem;padding:6px 0;}
/* 回饋 */
.fbout{margin-top:12px;}
/* 側面板（半透明、不加遮罩、從流程帶長出來） */
.sheet{position:fixed;top:16px;right:16px;height:calc(100vh - 32px);width:min(460px,calc(100vw - 32px));z-index:50;border-radius:24px;
  background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.7);box-shadow:0 24px 80px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.9);
  display:flex;flex-direction:column;opacity:0;transform:scale(.92);filter:blur(6px);pointer-events:none;
  transition:opacity .3s var(--ease),transform .38s var(--ease),filter .3s var(--ease);}
.sheet.show{opacity:1;transform:none;filter:none;pointer-events:auto;}
.sh-head{display:flex;align-items:center;gap:10px;padding:18px 18px 10px;}
.sh-head h3{margin:0;font-size:1.25rem;letter-spacing:-.01em;}
.sh-head .x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.06);cursor:pointer;font-size:15px;}
.sh-head .x:active{transform:scale(.94);}
.sh-body{flex:1;min-height:0;overflow:auto;padding:0 18px 18px;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 10px);mask-image:linear-gradient(180deg,transparent 0,#000 10px);}
.it{padding:12px 0;border-bottom:1px solid var(--line);}
.it:last-child{border-bottom:0;}
.it .h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9375rem;}
.it .st{margin-left:auto;font-size:.75rem;font-weight:700;color:var(--ink2);}
.it .q{margin-top:6px;font-size:.875rem;line-height:1.6;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.035);}
.it .q em{font-style:normal;color:var(--ink2);font-size:.75rem;margin-right:6px;font-variant-numeric:tabular-nums;}
.it .w{margin-top:4px;font-size:.8125rem;color:var(--ink2);}
.it .c{margin-top:4px;font-size:.75rem;color:var(--ink3);}
.star{border:0;background:transparent;cursor:pointer;font-size:.8125rem;color:var(--ink2);padding:4px 0;margin-top:4px;}
.star.on{color:#C98A00;font-weight:700;}
/* 對話框（檢核表、用量：需要專注 → 加遮罩） */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;}
.dim.show{opacity:1;pointer-events:auto;}
.dlg{position:fixed;left:50%;top:50%;width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px);z-index:61;background:#fff;border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.25);
  display:flex;flex-direction:column;opacity:0;transform:translate(-50%,-48%) scale(.96);pointer-events:none;transition:opacity .25s var(--ease),transform .32s var(--ease);}
.dlg.show{opacity:1;transform:translate(-50%,-50%);pointer-events:auto;}
.dlg .sh-body{-webkit-mask-image:none;mask-image:none;flex:0 1 auto;}
.dlg-foot{display:flex;gap:10px;padding:12px 18px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center;}
.stg{margin:14px 0 6px;font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;}
.erow{display:grid;grid-template-columns:150px 1fr 32px;gap:8px;margin-bottom:8px;align-items:start;}
.erow .in{height:38px;font-size:.875rem;}
.erow textarea.in{min-height:38px;height:38px;font-size:.8125rem;padding:8px 10px;}
.erow .del{width:32px;height:38px;border:0;background:transparent;color:var(--ink3);cursor:pointer;font-size:16px;}
table.use{width:100%;border-collapse:collapse;font-size:.875rem;font-variant-numeric:tabular-nums;}
table.use th,table.use td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;}
table.use th:first-child,table.use td:first-child{text-align:left;}
table.use th{font-size:.75rem;color:var(--ink2);font-weight:600;}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px;} .nums:empty{display:none;}
.nums div{background:#F5F5F7;border-radius:12px;padding:10px 12px;} .nums small{display:block;font-size:.75rem;color:var(--ink2);font-weight:600;} .nums b{font-size:1.25rem;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
.kb-seg{display:flex;width:100%;margin-bottom:14px;} .kb-seg button{flex:1;}
.kb-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px;} .kb-top b{font-size:1.0625rem;}
.kb-badge{font-size:.6875rem;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.06);color:var(--ink2);}
.kb-badge.ai{background:rgba(10,132,255,.12);color:#0A58CA;}
.kb-read{margin-top:8px;max-height:48vh;overflow:auto;padding:4px 14px 10px;border-radius:14px;background:#F7F7FA;}
.kb-h{font-weight:700;font-size:.9375rem;margin:14px 0 4px;} .kb-ul{margin:0;padding-left:20px;font-size:.875rem;line-height:1.7;color:var(--ink);}
.kb-src{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;} .kb-src summary{cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none;} .kb-src summary::-webkit-details-marker{display:none;}
.coach{margin-top:16px;padding:16px;border-radius:18px;background:#F4FBF6;border:1px solid rgba(46,157,91,.18);}
.coach-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px;} .coach-head b{font-size:1.0625rem;} .coach-head span{font-size:.875rem;color:var(--ink2);}
.coach-head em{font-style:normal;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;} .coach-head em.up{color:var(--good);font-size:1.125rem;}
.coach-it{background:#fff;border-radius:14px;padding:12px 14px;margin-top:8px;} .coach-it .h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9375rem;} .coach-it .st{margin-left:auto;font-size:.75rem;color:var(--ink2);font-weight:600;}
.coach-row{display:grid;grid-template-columns:92px 1fr;gap:8px;margin-top:6px;font-size:.875rem;line-height:1.6;} .coach-row small{color:var(--ink2);font-weight:600;font-size:.75rem;padding-top:2px;}
.coach-row em{display:block;font-style:normal;color:var(--ink2);font-size:.8125rem;} .coach-row .q2{color:var(--ink2);} .coach-row.say span{color:#1F7A3A;font-weight:600;}
@media (max-width:720px){ .coach-row{grid-template-columns:1fr;gap:2px;} }
.txwrap{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;}
.tx-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;} .tx-head b{font-size:1.0625rem;}
.tx{display:flex;flex-direction:column;gap:2px;}
.tx-h{margin:14px 0 4px;font-size:.75rem;font-weight:700;color:var(--ink2);letter-spacing:.04em;}
.tx-r{display:grid;grid-template-columns:52px 44px 1fr;gap:8px;padding:5px 8px;border-radius:10px;font-size:.9375rem;line-height:1.65;transition:background .3s;}
.tx-r .tt{color:var(--ink3);font-size:.75rem;font-variant-numeric:tabular-nums;padding-top:3px;}
.tx-r .who{font-weight:700;font-size:.875rem;color:var(--ink2);} .tx-r .who.a{color:var(--accent);}
.tx-r.hl{background:#FFF3C4;}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);background:rgba(29,29,31,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:.9375rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s var(--ease);z-index:80;max-width:calc(100vw - 32px);}
.toast.show{opacity:1;transform:translateX(-50%);}
.toast.err{background:#C0392B;}
@media (max-width:720px){
  .wrap{padding:18px 14px 80px;}
  .top h1{font-size:1.625rem;}
  .strip{grid-template-columns:repeat(3,1fr);}
  .pill::after{display:none;}
  .sheet{top:auto;left:0;right:0;bottom:0;width:100%;height:auto;max-height:82vh;border-radius:24px 24px 0 0;transform:translateY(40px);}
  .erow{grid-template-columns:1fr 32px;} .erow textarea.in{grid-column:1/2;}
}
@media (prefers-reduced-motion:reduce){
  .sheet,.dlg,.toast,.btn,.pill,.prog .bar b{transition:opacity .2s ease !important;transform:none !important;filter:none !important;}
  .dlg{transform:translate(-50%,-50%) !important;} .toast{transform:translateX(-50%) !important;}
}
@media (prefers-reduced-transparency:reduce){ .sheet{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none;} }
@media (prefers-contrast:more){ .card,.pill,.sheet{border:1px solid rgba(0,0,0,.4);} }
/* ★ ds146 會議作戰追蹤 */
.hero{background:linear-gradient(180deg,#FFFFFF,#F8F9FC);}
.hero .k{font-size:.8125rem;font-weight:700;color:var(--ink2);letter-spacing:.02em;}
.hero h2{font-size:1.5rem;line-height:1.2;letter-spacing:-.015em;margin:4px 0 6px;}
.hero p{margin:0;color:var(--ink2);font-size:.9375rem;}
.hero .row{margin-top:16px;}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.06);color:var(--ink2);white-space:nowrap;}
.chip.done{background:rgba(226,75,74,.12);color:#C93A39;}
.chip.part{background:rgba(232,163,61,.16);color:#9A6200;}
.chip.miss{background:rgba(46,157,91,.12);color:#1F7A3A;}
.chip.go{background:rgba(10,132,255,.10);color:#0A58CA;}
.chip.none{background:#fff;border:1px dashed var(--ink3);color:var(--ink2);}
.chip.keep{background:rgba(0,0,0,.05);color:var(--ink2);}
.chip.vague{background:#FFF3C4;color:#8A6100;}
table.mt{width:100%;border-collapse:collapse;font-size:.875rem;font-variant-numeric:tabular-nums;}
table.mt th,table.mt td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;}
table.mt th:first-child,table.mt td:first-child{text-align:left;}
table.mt th{font-size:.75rem;color:var(--ink2);font-weight:600;position:sticky;top:0;background:inherit;}
table.mt td.l,table.mt th.l{text-align:left;}
table.mt .red{color:#C93A39;font-weight:700;} table.mt .grn{color:#1F7A3A;font-weight:700;}
.tbl{overflow:auto;border-radius:14px;background:#FAFAFC;padding:2px 10px;margin-top:8px;}
.sec-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:18px 0 4px;} .sec-h b{font-size:1.0625rem;} .sec-h span{font-size:.8125rem;color:var(--ink2);}
.ti{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);}
.ti:last-child{border-bottom:0;}
.ti .w{font-weight:700;font-size:.9375rem;}
.ti .x{font-size:.9375rem;line-height:1.55;}
.ti .n{grid-column:1/2;font-size:.8125rem;color:var(--ink2);font-variant-numeric:tabular-nums;}
.ti .n b{color:var(--ink);}
.ti .r{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.ti .why{grid-column:1/3;font-size:.8125rem;color:var(--ink2);background:rgba(0,0,0,.035);border-radius:10px;padding:6px 10px;}
.meter{height:5px;border-radius:3px;background:rgba(0,0,0,.07);overflow:hidden;margin-top:6px;grid-column:1/2;}
.meter b{display:block;height:100%;border-radius:3px;background:var(--ink3);}
.meter.done b{background:var(--good);} .meter.part b{background:#E8A33D;}
.ed{display:grid;grid-template-columns:110px 1fr 170px 92px 140px 32px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);}
.ed .in{height:38px;font-size:.875rem;padding:0 10px;}
.ed .del{width:32px;height:38px;border:0;background:transparent;color:var(--ink3);cursor:pointer;font-size:16px;}
.ed-head{display:grid;grid-template-columns:110px 1fr 170px 92px 140px 32px;gap:6px;font-size:.75rem;color:var(--ink2);font-weight:600;padding:0 0 2px;}
.rc{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}

var _bk=null;
async function readBackup(f){
  if(!f) return; var info=$('bkInfo');
  try{ var j=JSON.parse(await f.text()); if(!j||!Array.isArray(j.cases)) throw new Error('這不是會議作戰追蹤的備份檔');
    var gs={}; myGroups().forEach(function(g){ gs[g.id]=1; }); var have={}; _cases.forEach(function(c){ if(c&&c.id) have[c.id]=1; });
    var ok=j.cases.filter(function(c){ return c&&c.id&&MT_TYPES[c.type]&&c[MT_TYPES[c.type]]; }), mine=ok.filter(function(c){ return gs[mtGid(c)]; }), fresh=mine.filter(function(c){ return !have[c.id]; });
    _bk=fresh; var n={interview_mt:0,interview_mtitem:0,interview_mtchk:0,interview_mtnick:0}; fresh.forEach(function(c){ n[c.type]++; });
    info.innerHTML='<b>'+esc(f.name)+'</b>（'+(j.at?fmtD(Date.parse(j.at)):'')+(j.by?'，'+esc(nm(j.by))+' 備份':'')+'）<br>'
      +(fresh.length?'可以補回：會議 '+n.interview_mt+' 場、說好的事 '+n.interview_mtitem+' 條、對帳與改判 '+n.interview_mtchk+' 筆'+(n.interview_mtnick?'、外號表':'')+'。'
        +(mine.length-fresh.length?'另外 '+(mine.length-fresh.length)+' 筆這裡已經有了，會跳過。':'')+(ok.length-mine.length?'有 '+(ok.length-mine.length)+' 筆是你看不到的組，不會還原。':'')
        +'<div class="row" style="margin-top:8px"><button class="btn pri sm" onclick="doRestore()">還原 '+fresh.length+' 筆</button></div>'
       :'這份備份的內容這裡都已經有了，不用還原。');
  }catch(e){ _bk=null; info.innerHTML='<span style="color:#C0392B;font-weight:600">讀不了：'+esc(e&&e.message||e)+'</span>'; }

async function doRestore(){ if(!_bk||!_bk.length) return; if(!canManage()&&!HG_ADMIN[ME()]){ toast('只有組長、學院主管、柏翰可以還原',true); return; }
  try{ await caseWrite(_bk,[]); }catch(e){ toast('沒還原進去：'+(e&&e.message||e),true); return; }
  var n=_bk.length; _bk=null; closeDlg(); renderAll(); toast('已還原 '+n+' 筆，原本的資料都沒動'); }

/* ── ★ ds146 資料底座：作廢、還原、資料健康、每天核對 ── */
async function voidMt(id){ var m=_cases.find(function(c){ return c.id===id; }); if(!m) return;
  var why=prompt('作廢「'+(m.mt.title||'這場會')+'」？\n這場會和它說好的事會從畫面、試算表拿掉，放進回收桶，之後可以還原。\n理由（選填）：',''); if(why===null) return;
  try{ await caseWrite([{ id:uid('ivv_'), type:'interview_void', by:ME(), createdAt:Date.now(), ivv:{ ref:id, why:why, group:m.mt.group, title:m.mt.title||'' } }]); }catch(e){ toast('沒作廢成功：'+e.message,true); return; }
  if(window.LEDGER) LEDGER.voidRef(id,why); closeDlg(); renderAll(); toast('已作廢，在「🩺 資料健康」可以還原'); }
async function unvoidMt(id){ try{ await caseWrite([{ id:uid('ivu_'), type:'interview_unvoid', by:ME(), createdAt:Date.now(), ivv:{ ref:id } }]); }catch(e){ toast(e.message,true); return; }
  if(window.LEDGER) LEDGER.restore(id); closeDlg(); renderAll(); toast('已還原'); }
function openMtHealth(){
  if(!window.LEDGER){ toast('資料底座沒載入，請重新整理',true); return; }
  LEDGER.openHealth(function(t,b,f){
    var vm=mtVoidMap(), vs=Object.keys(vm).filter(function(k){ return vm[k].type==='interview_void'&&vm[k].ivv.group; }).map(function(k){ return vm[k]; });
    b+='<div class="sec-h"><b>已作廢的會議</b><span>'+vs.length+' 場</span></div>'+(vs.length?vs.map(function(v){ return '<div class="hrow" style="cursor:default"><span class="d">'+fmtD(v.createdAt)+'</span><span class="m">'+esc((v.ivv.title||'')+(v.ivv.why?'・'+v.ivv.why:''))+'</span><button class="btn sm" onclick="unvoidMt(\''+v.ivv.ref+'\')">還原</button></div>'; }).join(''):'<p class="empty">沒有。</p>');
    openDlg(t,b,f); });
}
function mtReconcile(){
  if(!window.LEDGER) return; var day=new Date().toDateString(); try{ if(localStorage.getItem('ledger_rc_mt')===day) return; }catch(e){}
  var t0=Date.now()-60*864e5, gs={}, list=[]; myGroups().forEach(function(g){ gs[g.id]=1; });
  _cases.forEach(function(c){ if(!c||(c.createdAt||0)<t0) return;
    if(c.type==='interview_mt'&&c.mt&&gs[c.mt.group]&&!mtVoided(c.id)) list.push({ rid:c.id, at:c.createdAt, build:function(){ return { sheets:{'會議總表':[rowsMt(c)]}, head:mtHead(), rids:{'會議總表':[c.id]} }; } });
    else if(c.type==='interview_mtitem'&&c.mti&&gs[c.mti.group]) list.push({ rid:c.id, at:c.createdAt, build:function(){ return { sheets:{'會議追蹤項':[rowItem(c)]}, head:mtHead(), rids:{'會議追蹤項':[c.id]} }; } });
    else if(c.type==='interview_mtchk'&&c.mtc&&gs[c.mtc.group]) list.push({ rid:c.id, at:c.createdAt, build:function(){ return { sheets:{'會議追蹤項':[rowChk(c)]}, head:mtHead(), rids:{'會議追蹤項':[c.id]} }; } }); });
  LEDGER.reconcile(list).then(function(r){ try{ localStorage.setItem('ledger_rc_mt',day); }catch(e){} if(r&&r.sent) console.log('[mt] 核對：補送 '+r.sent+' 筆'); }).catch(function(e){ console.warn('[mt] 核對失敗（試算表可能還是舊版）',e); });
}

 {k:'you',t:'開會',s:'照議程開',you:'照建議議程開會，用手機錄音或 Apple 備忘錄轉錄',sys:'不打擾，你專心帶人',why:'議程照數字排，重點自然落在落後的地方',key:'最後每人說好一件事：誰、做什麼、看哪個數字、哪天前'},
 {k:'you',t:'貼上',s:'錄音或文字',you:'會後把錄音或文字貼進來，按「整理成會議記錄」',sys:'AI 照你們的格式排好會議記錄，找出這次說好的事，外號自動換成全名',why:'不用自己打會議記錄，Word 下載就是你們平常的格式',key:'口語、錯字都沒關係，AI 會整理'},
 {k:'you',t:'確認',s:'說好的事',you:'看過草稿，改、刪、補，按「確認存檔」',sys:'每條記下當下的數字當基準；缺期限或數量的標「說不清楚」提醒你',why:'AI 只給草稿，最後是你決定；說清楚的承諾才對得了帳',key:'5 分鐘內確認完，是這一步的目標'},
 {k:'sys',t:'對帳',s:'做到了沒',you:'不用做，打開就看得到',sys:'比對基準到現在增加多少：達標＝做到、到期有增加＝部分、沒增加＝沒做到、沒數字＝還沒回報',why:'不用每週追著問「做了沒」，數字自己會說話；特殊情況可以改判，要寫理由、留紀錄',key:'下一場會一開始先對帳，說到做到變成習慣'},
 {k:'sys',t:'調整',s:'下一步建議',you:'看建議，決定下週加強哪一塊',sys:'對照資料中心，指出最該處理的落後點和下一步；每場會都累積下來，可以回頭看',why:'每週比上週更準，組員知道組長在乎結果，不是在乎開會',key:'調整完回到第 1 步，飛輪越轉越快'}
];
var _gCur=0;
function gPt(a,rad){ a=(a-90)*Math.PI/180; return [150+rad*Math.cos(a),150+rad*Math.sin(a)]; }
function gWheel(){
  var R=142,r=64,h='';
  GUIDE.forEach(function(x,i){ var a0=i*60+1.6,a1=(i+1)*60-1.6,o0=gPt(a0,R),o1=gPt(a1,R),i1=gPt(a1,r),i0=gPt(a0,r),m=gPt(i*60+30,104),f=function(p){ return p[0].toFixed(1)+' '+p[1].toFixed(1); };
    h+='<g class="gseg '+x.k+(i===_gCur?' on':'')+'" data-i="'+i+'"><path d="M'+f(o0)+' A'+R+' '+R+' 0 0 1 '+f(o1)+' L'+f(i1)+' A'+r+' '+r+' 0 0 0 '+f(i0)+' Z"/>'
      +'<text x="'+m[0].toFixed(1)+'" y="'+(m[1]-17).toFixed(1)+'" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600">'+(i+1)+'</text>'
      +'<text x="'+m[0].toFixed(1)+'" y="'+m[1].toFixed(1)+'" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">'+x.t+'</text>'
      +'<text x="'+m[0].toFixed(1)+'" y="'+(m[1]+17).toFixed(1)+'" text-anchor="middle" dominant-baseline="central" font-size="11">'+x.s+'</text></g>'; });
  return '<svg class="g-wheel" id="gWheel" viewBox="0 0 300 300" role="listbox" tabindex="0" aria-label="使用步驟，左右鍵切換">'+h
    +'<circle cx="150" cy="150" r="58" fill="#fff" stroke="rgba(0,0,0,.08)"/>'
    +'<text x="150" y="128" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#6E6E73">飛輪的核心</text>'
    +'<text x="150" y="148" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700" fill="#1D1D1F" letter-spacing="-.3">說到做到</text>'
    +'<text x="150" y="168" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#6E6E73">每句承諾有數字</text>'
    +'<text x="150" y="182" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#6E6E73">有期限、有人對帳</text></svg>';
}
function gPanelHtml(){ var x=GUIDE[_gCur], you=x.k==='you';
  return '<div class="g-step '+x.k+'">第 '+(_gCur+1)+' 步・'+(you?'組長做':'系統自動')+'</div><div class="g-title">'+x.t+'：'+x.s+'</div>'
    +'<div class="g-row"><small>你要做的</small>'+x.you+'</div><div class="g-row"><small>系統幫你</small>'+x.sys+'</div><div class="g-row"><small>好處</small>'+x.why+'</div><div class="g-row"><small>小提醒</small>'+x.key+'</div>'
    +'<div class="g-nav"><button class="btn sm" onclick="gGo(-1)">上一步</button><button class="btn sm" onclick="gGo(1)">'+(_gCur===5?'回到第 1 步':'下一步')+'</button></div>'; }
function renderGuide(){
  var box=$('guide'); if(!box) return; var seen=false; try{ seen=!!localStorage.getItem('mt_guide_seen_v1'); }catch(e){}
  if(!seen) box.classList.add('open');
  box.innerHTML='<button class="g-head" onclick="gToggle()" aria-expanded="'+box.classList.contains('open')+'"><b>怎麼用</b><small>組長一週大約 10 分鐘</small><span class="chev" aria-hidden="true">⌄</span></button>'
    +'<div class="g-body"><div class="g-in"><div class="g-leg"><span><i style="background:#EEEEFC;border:1px solid #5856D6"></i>組長做的</span><span><i style="background:#F2F2F7;border:1px solid #C7C7CC"></i>系統自動做的</span></div>'
    +gWheel()+'<div class="g-panel" id="gPanel" aria-live="polite">'+gPanelHtml()+'</div>'
    +'<div class="g-flow"><span>看數字</span><em>›</em><span>說好一件事</span><em>›</em><span>綁一個數字</span><em>›</em><span>自動對帳</span><em>›</em><span>調整下一步</span><em>›</em><span class="up">業績往上</span></div></div></div>';
  var w=$('gWheel');
  w.addEventListener('pointerdown',function(e){ var g=e.target.closest('.gseg'); if(g) g.classList.add('pressed'); });

function gSet(i){ if(i===_gCur) return; _gCur=i;
