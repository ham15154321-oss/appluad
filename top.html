<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏆 通路王嘉許牆</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{ --maxw:420px; }
  html{ scroll-snap-type:y proximity; scroll-padding-top:118px; scroll-behavior:smooth; }
  body{
    font-family:'PingFang TC','Microsoft JhengHei',sans-serif; color:#fff;
    background:#07070e; min-height:100vh; padding-bottom:80px;
    transition:background .5s;
  }
  /* ===== theme page backgrounds ===== */
  body.theme-a{ background:radial-gradient(ellipse at 50% -5%,#21264d,#080a16 65%); }
  body.theme-b{ background:#06060f; }
  body.theme-b::before{ content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,230,255,.022) 3px 4px);}
  body.theme-c{ background:radial-gradient(ellipse at 50% 30%,#171109,#050402 75%); }
  body.theme-d{ background:#0a0612; }
  body.theme-d::before{ content:'';position:fixed;top:50%;left:50%;width:160vw;height:160vw;transform:translate(-50%,-50%);background:conic-gradient(from 0deg,#ff5cc8,#ffd35c,#5cff9e,#5cc8ff,#a05cff,#ff5cc8);opacity:.08;animation:spin 16s linear infinite;filter:blur(20px);pointer-events:none;z-index:0;}
  @keyframes spin{ to{ transform:translate(-50%,-50%) rotate(360deg);} }

  /* ===== header ===== */
  header{ position:sticky; top:0; z-index:20; backdrop-filter:blur(14px); background:rgba(10,10,20,.72); border-bottom:1px solid rgba(255,255,255,.08); }
  .hwrap{ max-width:var(--maxw); margin:0 auto; padding:10px 14px 8px; }
  .htop{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .htitle{ font-size:1.05rem; font-weight:800; letter-spacing:1px; background:linear-gradient(90deg,#ffd35c,#ff7ac0,#7ad0ff);-webkit-background-clip:text;background-clip:text;color:transparent; }
  .month-pill{ font-size:.72rem; padding:4px 11px; border-radius:20px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); color:#ffe; cursor:pointer; white-space:nowrap; }
  .switch-row{ display:flex; gap:6px; margin-top:9px; }
  .tbtn{ flex:1; font-size:.7rem; padding:7px 2px; border-radius:9px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:#bcbcd4; cursor:pointer; font-weight:700; transition:.2s; text-align:center; line-height:1.25; }
  .tbtn b{ display:block; font-size:.82rem; }
  .tbtn.on{ color:#fff; border-color:transparent; }
  body.theme-a .tbtn.on{ background:linear-gradient(135deg,#ffd35c,#ff9a3c); color:#1a1a1a; }
  body.theme-b .tbtn.on{ background:linear-gradient(135deg,#00e6ff,#7a5cff); }
  body.theme-c .tbtn.on{ background:linear-gradient(135deg,#e7c97a,#9c7a30); color:#1a1a1a; }
  body.theme-d .tbtn.on{ background:linear-gradient(135deg,#ff5cc8,#ffd35c); color:#1a1a1a; }
  .auto-tag{ font-size:.6rem; color:#8a8aa6; text-align:center; margin-top:6px; }
  .auto-tag span{ color:#ffd35c; }

  /* month sheet */
  .msheet{ display:none; position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); }
  .msheet.open{ display:block; }
  .msheet-inner{ position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:100%; max-width:var(--maxw); background:#14141f; border-radius:18px 18px 0 0; padding:18px 16px 30px; }
  .msheet-inner h3{ font-size:.92rem; margin-bottom:12px; color:#ffd35c; }
  .mgrid{ display:flex; flex-wrap:wrap; gap:8px; }
  .mopt{ font-size:.78rem; padding:8px 13px; border-radius:10px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.13); color:#ddd; cursor:pointer; }
  .mopt.on{ background:linear-gradient(135deg,#ffd35c,#ff9a3c); color:#1a1a1a; border-color:transparent; font-weight:800; }
  .mclose{ display:block; width:100%; margin-top:16px; padding:11px; border:none; border-radius:11px; background:rgba(255,255,255,.1); color:#fff; font-size:.85rem; cursor:pointer; }

  /* ===== sections & cards ===== */
  main{ width:100%; margin:0 auto; padding:0; position:relative; z-index:1; }
  .ind-section{ max-width:var(--maxw); margin:0 auto; padding:18px 16px 0; }
  .acad-section{ max-width:1180px; margin:0 auto; padding:6px 14px 0; }
  .acad-grid{ display:grid; gap:14px; grid-template-columns:repeat(2,1fr); align-items:start; }
  @media(min-width:560px){ .acad-grid{ grid-template-columns:repeat(3,1fr); } }
  @media(min-width:880px){ .acad-grid{ grid-template-columns:repeat(5,1fr); } }
  /* 學院卡：縮小成可一次看到五張的網格版（不影響個人王大卡） */
  body.theme-a .acad-grid .king-card, body.theme-b .acad-grid .king-card,
  body.theme-c .acad-grid .king-card, body.theme-d .acad-grid .king-card{ max-width:none !important; width:auto !important; padding:16px 11px 13px !important; }
  .acad-grid .king-card{ margin:0; scroll-snap-align:none; }
  .acad-grid .kc-photo-wrap{ width:70px; height:70px; margin:0 auto 8px; }
  .acad-grid .kc-photo{ width:70px; height:70px; }
  .acad-grid .kc-ch{ font-size:.6rem; letter-spacing:1px; }
  .acad-grid .kc-title{ font-size:.98rem; margin:3px 0 8px; }
  .acad-grid .kc-name{ font-size:.9rem; }
  .acad-grid .kc-val{ font-size:1.18rem; margin:0 0 4px; }
  .acad-grid .kc-stamp{ display:none; }
  .acad-grid .stars{ display:none !important; }
  .acad-grid .kc-runners{ padding-top:8px; margin-top:4px; }
  .acad-grid .kc-runner{ font-size:.68rem; padding:3px 2px; gap:5px; }
  .acad-grid .kc-runner .rk{ width:15px; height:15px; font-size:.56rem; }
  .acad-grid .photo-edit,.acad-grid .photo-clear{ width:24px; height:24px; font-size:.62rem; }
  .acad-grid .ssr-stamp{ font-size:.6rem; padding:2px 7px; top:8px; right:8px; }
  .sec-title{ text-align:center; font-size:.92rem; letter-spacing:3px; color:#cfcfe6; margin:26px 0 18px; position:relative; }
  .sec-title::before,.sec-title::after{ content:''; display:inline-block; width:34px; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.4)); vertical-align:middle; margin:0 10px; }
  .sec-title::after{ background:linear-gradient(90deg,rgba(255,255,255,.4),transparent); }

  .king-card{ position:relative; margin:0 auto 30px; scroll-snap-align:center; overflow:hidden; }
  .kc-fx{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:2; }

  .kc-body{ position:relative; z-index:3; }
  .kc-ch{ text-align:center; font-size:.74rem; letter-spacing:3px; }
  .kc-ico{ font-size:1rem; margin-right:4px; }
  .kc-title{ text-align:center; font-weight:900; font-size:1.5rem; margin:4px 0 16px; }
  .kc-photo{ width:118px; height:118px; margin:0 auto 12px; border-radius:50%; display:grid; place-items:center; font-size:3rem; overflow:hidden; }
  .kc-photo img{ width:100%; height:100%; object-fit:cover; }
  .kc-name{ text-align:center; font-weight:800; font-size:1.35rem; }
  .kc-val{ text-align:center; font-size:2.5rem; font-weight:900; letter-spacing:1px; margin:2px 0 4px; }
  .kc-stamp{ text-align:center; margin-bottom:12px; }
  .kc-runners{ list-style:none; border-top:1px dashed rgba(255,255,255,.14); padding-top:12px; margin-top:6px; }
  .kc-runner{ display:flex; align-items:center; gap:9px; font-size:.86rem; padding:6px 4px; }
  .kc-runner .rk{ width:20px; height:20px; border-radius:50%; background:rgba(255,255,255,.13); display:grid; place-items:center; font-size:.68rem; flex-shrink:0; }
  .kc-runner .rn{ flex-shrink:0; }
  .kc-runner .meter{ flex:1; height:6px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden; display:none; }
  .kc-runner .meter i{ display:block; height:100%; border-radius:3px; }
  .kc-runner .rv{ margin-left:auto; font-weight:700; }
  .no-photo-emoji{ filter:grayscale(.2); }
  .kc-photo-wrap{ position:relative; width:118px; height:118px; margin:0 auto 12px; }
  .kc-photo-wrap .kc-photo{ margin:0; }
  .photo-edit,.photo-clear{ position:absolute; border:none; cursor:pointer; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:.78rem; z-index:6; box-shadow:0 2px 8px rgba(0,0,0,.5); }
  .photo-edit{ right:-4px; bottom:-4px; background:rgba(20,20,30,.82); color:#fff; border:1px solid rgba(255,255,255,.35); }
  .photo-edit:active{ transform:scale(.9); }
  .photo-clear{ right:-4px; top:-4px; background:rgba(220,70,70,.92); color:#fff; }
  /* 輸出版不顯示編輯鈕 */
  .export-banner ~ main .photo-edit, .export-banner ~ main .photo-clear{ display:none; }

  /* ============ THEME A : 體育場冠軍聚光燈 ============ */
  body.theme-a .king-card{ width:100%; max-width:360px; background:linear-gradient(180deg,#1b2046,#0f1228); border:1.5px solid rgba(255,210,120,.4); border-radius:20px; padding:26px 22px 22px; box-shadow:0 12px 50px rgba(255,200,110,.16); }
  body.theme-a .king-card::before{ content:''; position:absolute; top:-50%; left:50%; width:60%; height:160%; transform:translateX(-50%); background:conic-gradient(from 180deg at 50% 0,transparent 76deg,rgba(255,225,150,.14) 90deg,transparent 104deg); }
  body.theme-a .kc-ch{ color:#c7c2ff; }
  body.theme-a .kc-title{ color:#ffd35c; text-shadow:0 0 18px rgba(255,200,90,.5); }
  body.theme-a .kc-photo{ background:radial-gradient(circle,#3a3f6e,#1a1d3a); border:4px solid #ffd35c; box-shadow:0 0 30px rgba(255,205,90,.5); animation:floaty 3.4s ease-in-out infinite; }
  @keyframes floaty{ 50%{ transform:translateY(-7px);} }
  body.theme-a .kc-val{ color:#ffd35c; text-shadow:0 0 20px rgba(255,200,90,.4); }
  body.theme-a .kc-runner .rv{ color:#ffd99a; }
  .confetti{ position:absolute; width:8px; height:9px; opacity:.9; animation:fall linear infinite; }
  @keyframes fall{ 0%{ transform:translateY(-20px) rotate(0); } 100%{ transform:translateY(560px) rotate(540deg); opacity:0; } }

  /* ============ THEME B : 電競霓虹排行榜 ============ */
  body.theme-b .king-card{ width:100%; max-width:360px; background:linear-gradient(160deg,#0d1530,#0a0a1a); border-radius:16px; padding:24px 20px 20px; clip-path:polygon(0 0,100% 0,100% 94%,94% 100%,0 100%); border:1px solid rgba(0,230,255,.45); box-shadow:0 0 36px rgba(0,200,255,.22),inset 0 0 26px rgba(255,0,200,.07); }
  body.theme-b .king-card::after{ content:''; position:absolute; inset:0; box-shadow:inset 0 0 0 1px rgba(0,230,255,.6); clip-path:polygon(0 0,100% 0,100% 94%,94% 100%,0 100%); animation:pulseB 1.8s ease-in-out infinite; pointer-events:none; }
  @keyframes pulseB{ 50%{ opacity:.3; } }
  body.theme-b .kc-ch{ color:#ff5cc8; }
  body.theme-b .kc-title{ color:#00e6ff; text-shadow:0 0 16px rgba(0,230,255,.7); }
  body.theme-b .kc-photo{ border-radius:14px; background:linear-gradient(135deg,#1a2350,#10132b); border:1.5px solid rgba(0,230,255,.55); box-shadow:0 0 22px rgba(0,230,255,.4); }
  body.theme-b .kc-val{ color:#fff; text-shadow:0 0 18px rgba(0,230,255,.8); }
  body.theme-b .kc-runner .meter{ display:block; }
  body.theme-b .kc-runner .meter i{ background:linear-gradient(90deg,#00e6ff,#7a5cff); }
  body.theme-b .kc-runner .rv{ color:#7ad0ff; }
  body.theme-b .kc-runner .rn{ color:#9fb6d6; }

  /* ============ THEME C : 金色奧斯卡尊榮 ============ */
  body.theme-c .king-card{ width:100%; max-width:350px; background:linear-gradient(180deg,#15110a,#0c0a06); border:1px double rgba(220,180,100,.55); border-radius:8px; padding:28px 22px 24px; box-shadow:0 0 46px rgba(200,160,80,.14); }
  body.theme-c .king-card::before{ content:''; position:absolute; inset:8px; border:1px solid rgba(220,180,100,.3); border-radius:4px; pointer-events:none; }
  body.theme-c .kc-ch{ color:#9c8a64; letter-spacing:5px; }
  body.theme-c .kc-title{ font-family:Georgia,'Songti TC',serif; letter-spacing:5px; background:linear-gradient(180deg,#fbe7a8,#c79a45);-webkit-background-clip:text;background-clip:text;color:transparent; }
  body.theme-c .kc-photo{ background:radial-gradient(circle,#2a2114,#140f08); border:2px solid #d9b76a; box-shadow:0 0 0 5px rgba(217,183,106,.12),0 0 26px rgba(217,183,106,.4); }
  body.theme-c .kc-name{ font-family:Georgia,'Songti TC',serif; color:#f4e3b6; letter-spacing:2px; }
  body.theme-c .kc-val{ color:#e7c97a; }
  body.theme-c .kc-runners{ border-top:1px solid transparent; border-image:linear-gradient(90deg,transparent,rgba(217,183,106,.5),transparent) 1; }
  body.theme-c .kc-runner .rk{ background:rgba(217,183,106,.18); color:#e7c97a; }
  body.theme-c .kc-runner .rv{ color:#d9b76a; }
  body.theme-c .kc-runner .rn{ color:#b6a884; }
  .dust{ position:absolute; width:3px; height:3px; border-radius:50%; background:#e7c97a; opacity:.6; animation:rise linear infinite; }
  @keyframes rise{ 0%{ transform:translateY(40px); opacity:0;} 30%{opacity:.7;} 100%{ transform:translateY(-420px); opacity:0; } }

  /* ============ THEME D : 抽卡 SSR 召喚 ============ */
  body.theme-d .king-card{ width:100%; max-width:340px; border-radius:20px; padding:3px; background:linear-gradient(135deg,#ff5cc8,#ffd35c,#5cc8ff,#a05cff); background-size:300% 300%; animation:holo 5s ease infinite; box-shadow:0 8px 50px rgba(255,150,230,.4); }
  @keyframes holo{ 50%{ background-position:100% 100%; } }
  body.theme-d .kc-inner{ background:linear-gradient(180deg,#160d24,#0c0716); border-radius:17px; padding:24px 20px 22px; position:relative; overflow:hidden; }
  body.theme-d .kc-inner::before{ content:''; position:absolute; top:-60%; left:-40%; width:55%; height:230%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent); transform:rotate(20deg); animation:sheen 4s ease-in-out infinite; pointer-events:none; }
  @keyframes sheen{ 0%,68%{ left:-45%;} 100%{ left:135%;} }
  body.theme-d .kc-ch{ color:#b69adf; }
  body.theme-d .kc-title{ background:linear-gradient(90deg,#ffd35c,#ff9ad2,#9ad2ff);-webkit-background-clip:text;background-clip:text;color:transparent; }
  body.theme-d .kc-photo{ border-radius:18px; background:radial-gradient(circle,#2a1d44,#140b22); border:2px solid rgba(255,210,120,.7); box-shadow:0 0 30px rgba(255,150,230,.6); }
  body.theme-d .kc-val{ color:#ffd35c; text-shadow:0 0 20px rgba(255,200,90,.7); }
  body.theme-d .kc-runner .rk{ background:rgba(255,210,120,.18); color:#ffd35c; }
  body.theme-d .kc-runner .rv{ color:#ffce8a; }
  body.theme-d .kc-runner .rn{ color:#c3b0e0; }
  .ssr-stamp{ position:absolute; top:14px; right:14px; z-index:4; font-size:.78rem; font-weight:900; color:#160d24; background:linear-gradient(90deg,#ffd35c,#ff9ad2); padding:3px 11px; border-radius:20px; letter-spacing:1px; box-shadow:0 0 14px rgba(255,210,90,.7); }
  .stars{ text-align:center; color:#ffd35c; font-size:.95rem; letter-spacing:3px; margin:-2px 0 8px; }

  /* ============ THEME E : 3D 星空頒獎殿堂 ============ */
  body.theme-e{ background:radial-gradient(ellipse at 50% 120%,#132046,#060814 60%); }
  body.theme-e::before{ content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 60%,#cfe0ff,transparent),radial-gradient(1px 1px at 40% 80%,#fff,transparent),radial-gradient(1px 1px at 85% 20%,#9fd0ff,transparent),radial-gradient(1.5px 1.5px at 55% 45%,#fff,transparent);
    background-size:520px 520px,420px 420px,300px 300px,600px 600px,360px 360px; animation:starDrift 40s linear infinite; opacity:.8; }
  @keyframes starDrift{ 100%{ background-position:520px 260px,-420px 210px,300px -150px,-300px 300px,180px -180px; } }
  body.theme-e::after{ content:''; position:fixed; top:-40%; left:50%; width:80%; height:180%; transform:translateX(-50%); z-index:0; pointer-events:none;
    background:conic-gradient(from 180deg at 50% 0,transparent 74deg,rgba(150,190,255,.16) 90deg,transparent 106deg); filter:blur(2px); }
  body.theme-e .king-card{ width:100%; max-width:360px; background:linear-gradient(180deg,rgba(30,42,88,.9),rgba(10,14,34,.95)); border:1.5px solid rgba(150,190,255,.45); border-radius:22px; padding:26px 22px 22px; box-shadow:0 18px 60px rgba(90,140,255,.28),inset 0 0 30px rgba(120,170,255,.08); backdrop-filter:blur(3px); animation:floaty 4s ease-in-out infinite; }
  body.theme-e .kc-ch{ color:#9fd0ff; letter-spacing:4px; }
  body.theme-e .kc-title{ color:#eaf2ff; text-shadow:0 0 22px rgba(140,190,255,.8); }
  body.theme-e .kc-photo{ background:radial-gradient(circle,#26356b,#111634); border:4px solid #9fd0ff; box-shadow:0 0 34px rgba(120,180,255,.65); }
  body.theme-e .kc-name{ color:#dfeaff; }
  body.theme-e .kc-val{ color:#bcd8ff; text-shadow:0 0 22px rgba(130,180,255,.6); }
  body.theme-e .kc-runner .rv{ color:#bcd8ff; }
  body.theme-e .tbtn.on{ background:linear-gradient(135deg,#9fd0ff,#5c7aff); color:#0a1020; }

  /* ============ THEME F : 熔岩競技場 ============ */
  body.theme-f{ background:radial-gradient(ellipse at 50% 110%,#5a1405,#1a0602 55%,#0a0402 85%); }
  body.theme-f::before{ content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(circle at 50% 108%,rgba(255,120,20,.34),transparent 46%),repeating-linear-gradient(120deg,transparent 0 26px,rgba(255,90,20,.03) 26px 27px); animation:lavaPulse 3.6s ease-in-out infinite; }
  @keyframes lavaPulse{ 50%{ opacity:.72; } }
  body.theme-f .king-card{ width:100%; max-width:360px; background:linear-gradient(180deg,#2a0f06,#120603); border:1.5px solid rgba(255,120,40,.5); border-radius:14px; padding:26px 22px 22px; box-shadow:0 12px 46px rgba(255,90,20,.3),inset 0 0 24px rgba(255,80,10,.1); }
  body.theme-f .king-card::before{ content:''; position:absolute; inset:0; border-radius:14px; pointer-events:none; box-shadow:inset 0 0 22px rgba(255,140,40,.35); animation:lavaPulse 2.4s ease-in-out infinite; }
  body.theme-f .kc-ch{ color:#ffb37a; letter-spacing:3px; }
  body.theme-f .kc-title{ color:#ffd24a; text-shadow:0 0 20px rgba(255,120,20,.85); }
  body.theme-f .kc-photo{ background:radial-gradient(circle,#4a1a08,#1c0803); border:3px solid #ff8a2a; box-shadow:0 0 30px rgba(255,110,20,.7); }
  body.theme-f .kc-name{ color:#ffe0a6; }
  body.theme-f .kc-val{ color:#ffb04a; text-shadow:0 0 22px rgba(255,110,20,.7); }
  body.theme-f .kc-runner .rv{ color:#ffb04a; }
  body.theme-f .tbtn.on{ background:linear-gradient(135deg,#ff8a2a,#ff3d2e); color:#180804; }
  .ember{ position:absolute; width:5px; height:5px; border-radius:50%; background:#ff8a2a; box-shadow:0 0 8px #ff5a10; opacity:.85; animation:emberRise linear infinite; }
  @keyframes emberRise{ 0%{ transform:translateY(30px) scale(1); opacity:0; } 20%{ opacity:.9; } 100%{ transform:translateY(-460px) scale(.3); opacity:0; } }

  /* ============ THEME G : 賽博龐克全息 ============ */
  body.theme-g{ background:#05060f; }
  body.theme-g::before{ content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,0,200,.05) 1px,transparent 1px); background-size:34px 34px; mask-image:radial-gradient(ellipse at 50% 40%,#000 40%,transparent 85%); }
  body.theme-g::after{ content:''; position:fixed; inset:0; z-index:0; pointer-events:none; background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,240,255,.035) 2px 3px); animation:scanMove 8s linear infinite; }
  @keyframes scanMove{ 100%{ background-position:0 60px; } }
  body.theme-g .king-card{ width:100%; max-width:360px; background:linear-gradient(160deg,#0a1024,#080510); border-radius:4px; padding:24px 20px 20px; border:1px solid rgba(0,240,255,.5); clip-path:polygon(0 0,100% 0,100% 90%,90% 100%,0 100%); box-shadow:0 0 30px rgba(0,220,255,.25),inset 0 0 22px rgba(255,0,200,.08); }
  body.theme-g .king-card::after{ content:''; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 0 1px rgba(255,0,200,.5); clip-path:polygon(0 0,100% 0,100% 90%,90% 100%,0 100%); animation:glitchB 2.6s steps(2) infinite; }
  @keyframes glitchB{ 0%,92%,100%{ transform:translate(0,0); } 94%{ transform:translate(-2px,1px); } 96%{ transform:translate(2px,-1px); } }
  body.theme-g .kc-ch{ color:#ff2fd0; letter-spacing:4px; }
  body.theme-g .kc-title{ color:#00f0ff; text-shadow:0 0 8px #00f0ff,2px 0 0 rgba(255,0,200,.6),-2px 0 0 rgba(0,240,255,.6); }

<script>
/* ======================= 資料來源（與績效對比頁同一 localStorage）======================= */
const CH = [
  { key:'net',      name:'網際網路', icon:'🌐' },
  { key:'purchase', name:'學員加購', icon:'🛒' },
  { key:'event',    name:'展場活動', icon:'🎪' },
  { key:'referral', name:'學員介紹', icon:'🤝' },
  { key:'admin',    name:'班務追回', icon:'📋' },
  { key:'cash',     name:'現＋刷',   icon:'💳' }
];
const KING_TITLES = { net:'網路王', purchase:'加購王', event:'展場王', referral:'介紹王', admin:'班務王', cash:'現金王' };
const ACAD_TITLES = { net:'學院網路王', purchase:'學院加購王', event:'學院展場王', referral:'學院介紹王', admin:'學院班務王' };

function readJSON(k, fb){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):fb; }catch(e){ return fb; } }
const DEFAULT_ACADEMIES=['高雄建國','中壢學院','中壢二部','台中一部','中壢三部','台中三部','台中二部'];

/* ---- 自動掃描整個 localStorage，找出所有「通路績效」資料，不靠固定 key 名稱 ---- */
function isMotivShape(o){ return !!(o && o.meta && o.channels && parseInt(o.meta.month,10)>=1 && parseInt(o.meta.month,10)<=12); }
function isChDataShape(o){ if(!o||typeof o!=='object'||Array.isArray(o)) return false;
  for(const k of Object.keys(o)){ const m=parseInt(k,10); if(m>=1&&m<=12 && o[k]&&typeof o[k]==='object' && CH.some(ch=>o[k][ch.key])) return true; }
  return false; }
function motivToChannels(data){ const out={};
  CH.forEach(ch=>{ const src=data.channels[ch.key];
    if(!src){ out[ch.key]={ranking:[],academies:[]}; return; }
    const amap={}; (src.academies||[]).forEach(a=>{amap[a.name]=a.value;});
    const acs=DEFAULT_ACADEMIES.map(n=>({name:n,value:amap[n]||0}));
    (src.academies||[]).forEach(a=>{ if(DEFAULT_ACADEMIES.indexOf(a.name)<0) acs.push({name:a.name,value:a.value}); });
    acs.sort((a,b)=>b.value-a.value);
    out[ch.key]={ ranking:src.ranking||[], academies:acs };
  });
  return out;
}
let _scan=null;
function scanSources(){
  const master={}, sources=[], allKeys=[];
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i); allKeys.push(key);
    let val; try{ val=JSON.parse(localStorage.getItem(key)); }catch(e){ continue; }
    // 1) 歷史/同步型（{ 月:{ 通路:{ranking,academies} } }）先鋪底
    if(isChDataShape(val)){
      let mhit=[];
      Object.keys(val).forEach(k=>{ const m=parseInt(k,10); if(m>=1&&m<=12){ master[m]=master[m]||{}; CH.forEach(ch=>{ if(val[k][ch.key]&&!master[m][ch.key]) master[m][ch.key]=val[k][ch.key]; }); mhit.push(m); } });
      if(mhit.length) sources.push({key,type:'歷史/同步',months:[...new Set(mhit)].sort((a,b)=>a-b)});
    }
  }
  // 2) EIP 當月型（{meta:{month},channels:{...}}）後蓋，優先級高
  //    ★ 同一個月可能有多個角色各自的快照，且內容不同（各自在不同時間跑 EIP 同步）。
  //      舊版：誰被掃到最後就用誰 → 舊快照會蓋掉新資料（例：top 顯示 江安琪 18萬，其實最新是 范淯維 24.7萬）。
  //      新版：同月取「總業績量最大」那份 = 累積到最完整 = 最新一次同步（EIP 越晚同步累積越多、人數越多）。
  const _motivBest={}; // month -> { key, val, total }
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i); let val; try{ val=JSON.parse(localStorage.getItem(key)); }catch(e){ continue; }
    if(isMotivShape(val)){
      const m=parseInt(val.meta.month,10);
      let total=0; const chs=val.channels||{};
      Object.keys(chs).forEach(function(c){ (chs[c].ranking||[]).forEach(function(r){ total+=(r.value||0); }); });
      if(!_motivBest[m] || total>_motivBest[m].total){ _motivBest[m]={key:key,val:val,total:total}; }
    }
  }
  Object.keys(_motivBest).forEach(function(mStr){
    const m=parseInt(mStr,10); const rec=_motivBest[m]; const per=motivToChannels(rec.val);
    master[m]=master[m]||{}; CH.forEach(function(ch){ master[m][ch.key]=per[ch.key]; });
    sources.push({key:rec.key,type:'EIP當月',months:[m]});
  });
  _scan={master,sources,allKeys};
  return _scan;
}
function getScan(){ return _scan || scanSources(); }
function getChData(){ return getScan().master; }
function getMotivOverlay(){ const s=getScan().sources.filter(x=>x.type==='EIP當月'); if(!s.length) return null; return { month:s[s.length-1].months[0] }; }
function getCastle(){ return readJSON('castle_cards_v1', []); }
function getAssign(){ const a=readJSON('perf_compare_v1_honor_assign_v1', {individual:{},academy:{}}); a.individual=a.individual||{}; a.academy=a.academy||{}; return a; }

function fmtComma(n){ return (n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function fmtWan(n){ if(!n) return '—'; return fmtComma(Math.round(n/10000))+'萬'; }

function findCastleCard(name){ if(!name) return null; const cs=getCastle(); return cs.find(c=>c.name && c.name.trim()===name.trim() && c.photo) || null; }
function cardById(id){ if(id==null) return null; const cs=getCastle(); return cs.find(c=>String(c.id)===String(id) && c.photo) || null; }
function matchAcademyCard(acadName){ if(!acadName) return null;
  const cs=getCastle().filter(c=>c.photo && ['yellow','purple','black','blue'].includes(c.color) && c.name);
  let m=cs.find(c=>c.name.trim()===acadName.trim()); if(m) return m;
  m=cs.find(c=>c.name.includes(acadName)); if(m) return m;
  let best=null,bl=0; cs.forEach(c=>{ if(acadName.includes(c.name.trim()) && c.name.trim().length>bl){bl=c.name.trim().length;best=c;} });
  return best;
}

/* ======================= 月份 / 季度偵測與聚合 ======================= */
function monthHasData(d,m){ if(!d[m]) return false; return CH.some(ch=>{ const x=d[m][ch.key]||{}; return (x.ranking||[]).length>0 || (x.academies||[]).some(a=>a.value>0); }); }
function availableMonths(){ const d=getChData(); const out=[]; for(let m=1;m<=12;m++){ if(monthHasData(d,m)) out.push(m); } return out; }
const QUARTERS=[{q:1,ms:[1,2,3]},{q:2,ms:[4,5,6]},{q:3,ms:[7,8,9]},{q:4,ms:[10,11,12]}];
function availableQuarters(){ const d=getChData(); return QUARTERS.filter(Q=>Q.ms.some(m=>monthHasData(d,m))); }

function channelsForMonth(m){ const d=getChData();
  return CH.map(ch=>{ const x=d[m]?.[ch.key]||{};
    return { chKey:ch.key, chName:ch.name, icon:ch.icon,
      ranking:[...(x.ranking||[])].sort((a,b)=>b.value-a.value),
      academies:[...(x.academies||[])].sort((a,b)=>b.value-a.value) }; });
}
function channelsForQuarter(ms){ const d=getChData();
  return CH.map(ch=>{ const pm={},am={};
    ms.forEach(m=>{ (d[m]?.[ch.key]?.ranking||[]).forEach(p=>{pm[p.name]=(pm[p.name]||0)+p.value;});
                    (d[m]?.[ch.key]?.academies||[]).forEach(a=>{ if(a.value) am[a.name]=(am[a.name]||0)+a.value; }); });
    return { chKey:ch.key, chName:ch.name, icon:ch.icon,
      ranking:Object.entries(pm).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value),
      academies:Object.entries(am).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value) }; });
}

function getPhotoOverrides(){ return readJSON('kingwall_photos', {}); }
function savePhotoOverride(name, dataURL){ const o=getPhotoOverrides(); o[name]=dataURL;
  try{ localStorage.setItem('kingwall_photos', JSON.stringify(o)); return true; }
  catch(e){ alert('照片存不下了（瀏覽器空間已滿）。試試換小一點的圖，或先移除其他自訂照片。'); return false; } }
function clearPhotoOverride(name){ const o=getPhotoOverrides(); delete o[name]; localStorage.setItem('kingwall_photos', JSON.stringify(o)); }
function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

function photoBlock(name, card, fallbackIcon){
  const ov=getPhotoOverrides()[name];
  const src = ov || (card && card.photo) || null;
  const inner = src ? `<img src="${src}" alt="">` : `<span class="no-photo-emoji">${fallbackIcon||'👤'}</span>`;
  return `<div class="kc-photo-wrap" data-name="${escAttr(name)}">
      <div class="kc-photo">${inner}</div>
      <button class="photo-edit" onclick="pickPhoto(event)" title="換照片">📷</button>
      ${ov?`<button class="photo-clear" onclick="resetPhoto(event)" title="移除自訂照片">✕</button>`:''}
    </div>`;
}

/* 縮圖後存（最長邊 460px、JPEG 0.82），避免塞爆 localStorage */
function fileToThumb(file, cb){
  const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{
    const max=460; let w=img.width, h=img.height; const sc=Math.min(1, max/Math.max(w,h));
    w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    try{ cb(c.toDataURL('image/jpeg',0.82)); }catch(e){ cb(r.result); }
  }; img.onerror=()=>cb(r.result); img.src=r.result; };
  r.readAsDataURL(file);
}
let _editingName=null;
function pickPhoto(e){ e.stopPropagation(); const wrap=e.target.closest('.kc-photo-wrap'); if(!wrap) return; _editingName=wrap.dataset.name; document.getElementById('photoInput').click(); }
function resetPhoto(e){ e.stopPropagation(); const wrap=e.target.closest('.kc-photo-wrap'); if(!wrap) return; clearPhotoOverride(wrap.dataset.name); render(); }
function onPhotoFile(input){ const f=input.files&&input.files[0]; input.value=''; if(!f||!_editingName) return;
  fileToThumb(f, dataURL=>{ if(savePhotoOverride(_editingName, dataURL)) render(); }); }
function runnersHTML(rows, kingVal, fmt){
  return rows.map((r,i)=>{ const pct=kingVal?Math.max(8,Math.round(r.value/kingVal*100)):0;
    return `<li class="kc-runner"><span class="rk">${i+2}</span><span class="rn">${r.name}</span><span class="meter"><i style="width:${pct}%"></i></span><span class="rv">${fmt(r.value)}</span></li>`;
  }).join('');
}
function stampHTML(){ // theme-aware label; D handled separately
  return `<div class="kc-stamp"><span class="gold-stamp stamp-hide">CHANNEL · KING</span></div>`;
}
function cardInner(ch, who, title, val, photoCard, fbIcon, runners, fmt){
  return `
    <span class="ssr-stamp" style="display:none">SSR</span>
    <div class="kc-body">
      <div class="kc-ch"><span class="kc-ico">${ch.icon}</span>${title.includes('學院')?ch.chName+' 學院':ch.chName}</div>
      <div class="kc-title">👑 ${title}</div>

      <div class="kc-name">${who}</div>
      <div class="kc-val">${val}</div>

}
function buildIndividualCard(ch){
  const top5=ch.ranking.slice(0,5); if(top5.length===0) return '';
  const king=top5[0]; const assign=getAssign();
  const photoCard = assign.individual[ch.chKey] ? cardById(assign.individual[ch.chKey]) : findCastleCard(king.name);
  const title=KING_TITLES[ch.chKey]||ch.chName+'王';
  const runners=runnersHTML(top5.slice(1), king.value, fmtWan);
  const inner=cardInner(ch, king.name, title, fmtWan(king.value), photoCard, '👤', runners, fmtWan);
  return `<div class="king-card" data-ch="${ch.chKey}"><div class="kc-fx"></div><div class="kc-inner">${inner}</div></div>`;
}
function buildAcademyCard(ch){
  if(ch.chKey==='cash') return '';
  const sorted=ch.academies.filter(a=>a.value>0); if(sorted.length===0) return '';
  const top=sorted[0]; const assign=getAssign();
  let card = assign.academy[ch.chKey] ? cardById(assign.academy[ch.chKey]) : matchAcademyCard(top.name);
  const title=ACAD_TITLES[ch.chKey]||'學院'+ch.chName+'王';
  const runners=runnersHTML(sorted.slice(1,5), top.value, fmtComma);
  const inner=cardInner(ch, top.name, title, fmtComma(top.value), card, '🏫', runners, fmtComma);
  return `<div class="king-card" data-ch="${ch.chKey}"><div class="kc-fx"></div><div class="kc-inner">${inner}</div></div>`;
}

function pickDefaultMonth(){
  const months=availableMonths();
  const ov=getMotivOverlay();              // 1) 有 EIP 當月即時資料 → 優先選那個月（例如六月）
  if(ov && months.includes(ov.month)){ selectMonth(ov.month); return; }
  const nowM=new Date().getMonth()+1;        // 2) 本月有資料 → 本月
  if(months.includes(nowM)){ selectMonth(nowM); return; }
  if(months.length){ selectMonth(months[months.length-1]); return; } // 3) 最後一個有資料的月
  const qs=availableQuarters(); if(qs.length){ selectQuarter(qs[0]); return; } // 4) 第一個有資料的季
  render(); // 5) 完全沒資料 → 顯示提示
}

<!-- 🎮 遊戲程式獨立成一段：輸出時會被一起打包進去 -->
<script id="gameScript">
/* ═══════════════ 🎮 榮譽牆打磚塊（預設直接玩・打磚塊→中央彈卡・冠軍3倍+加冕）═══════════════ */
const GAME = (function(){
  const CONFIG = {
    PIXEL_SIZE:4, COLS:10, ROWS:6, BRICK_GAP:2, BRICK_H:24, WALL_TOP:150,
    PADDLE_W:96, PADDLE_H:12, BALL_SIZE:8, BALL_SPEED:300, PADDLE_SPEED:560,
    SPEEDUP_EVERY:20, SPEEDUP_FACTOR:1.06, SPEED_CAP:1.4,
    MAX_BOUNCE_DEG:60, MIN_VY_RATIO:0.34, LIVES:3,
    ROW_SCORES:[60,50,40,30,20,10],
    ROW_COLORS:['#ff4d6d','#ff9f43','#ffd93d','#5bd67d','#4d96ff','#b06bff'],
    CHAMP_COLOR:'#ffd94a', CHAMP_MULT:3,
    PADDLE_COLOR:'#ffffff', BALL_COLOR:'#ffffff',
    POPUP_MS:1200,           // 中央彈卡停留(含淡入淡出)-小卡快閃
    POPUP_MAXW:240,          // 中央彈卡最大寬(px),不再撐滿螢幕
    SPOT_ROTATE_MS:2500,     // 右上聚光燈輪播間隔:每位排名輪流被看見
    BASE_W:480, BASE_H:760   // 縮放同時看寬高,取較小者→磚牆永遠塞得進畫面(不會被寬螢幕撐爆)
  };
  const cv=document.getElementById('gameCanvas'), ctx=cv.getContext('2d');
  let cssW=480,cssH=800,S=1,dpr=1;
  let bricks=[], paddleX=0,paddleY=0,paddleW=96,paddleH=12;
  let ball={x:0,y:0,vx:0,vy:0,size:8}, ballStuck=true;
  let speed=300,speedMul=1,brokenCount=0;
  let score=0,lives=CONFIG.LIVES,bricksLeft=0;
  let state='start';
  let people=[], bursts=[], crowns=[], flash=0, popup=null, toastMsg=null;
  let spot=null, spotIdx=0, spotT=0;   // 右上聚光燈輪播
  let keyDir=0,lastInput='key',pointerX=null;
  let running=false,rafId=null,lastT=0,startMs=0,elapsedMs=0,_btnRect=null;
  const imgCache={};
  const round=Math.round, PS=CONFIG.PIXEL_SIZE, snap=v=>round(v/PS)*PS;

  // ── 音效 ──
  let AC=null;
  function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}} return AC; }
  function beep(f,d,t,g,w){ const ac=audio(); if(!ac)return; const s=ac.currentTime+(w||0);
    const o=ac.createOscillator(),ga=ac.createGain(); o.type=t||'square'; o.frequency.value=f;
    o.connect(ga); ga.connect(ac.destination); ga.gain.setValueAtTime(0.0001,s); ga.gain.linearRampToValueAtTime(g||0.06,s+0.008);
    ga.gain.exponentialRampToValueAtTime(0.0001,s+d); o.start(s); o.stop(s+d+0.03); }
  const sfxBounce=()=>beep(520,0.05,'square',0.045);
  const sfxBreak =()=>beep(700,0.05,'square',0.05);
  const sfxChamp =()=>[523,659,784,1046].forEach((f,i)=>beep(f,0.16,'triangle',0.09,i*0.06));
  const sfxLose  =()=>{beep(200,0.3,'sawtooth',0.08);beep(120,0.4,'sawtooth',0.05,0.05);};
  const sfxClear =()=>[523,659,784,1046,1318].forEach((f,i)=>beep(f,0.22,'triangle',0.09,i*0.09));

  // ── 抓當下榜單的人（含名次/業績/榜別/照片）；排除離職黃士驊 ──
  function collectPeople(){
    const clean=s=>(s||'').trim().replace(/\s+/g,'');
    const list=[];
    document.querySelectorAll('#main .king-card').forEach(card=>{
      const award=clean((card.querySelector('.kc-title')||{}).textContent||'').replace(/^👑/,'');
      const chn=clean((card.querySelector('.kc-ch')||{}).textContent||'');

        const rn=clean((r.querySelector('.rn')||{}).textContent||'');
        const rv=clean((r.querySelector('.rv')||{}).textContent||'');

      });
    });
    if(!list.length){ for(let i=0;i<8;i++) list.push({name:['冠軍','榮耀','王者','菁英','高手','達人','先鋒','領袖'][i],rank:i?i+1:1,val:'',award:'榮譽榜',chn:'',photo:'',champ:i<2}); }

  }

  function layout(){
    const r=cv.getBoundingClientRect();

    paddleW=CONFIG.PADDLE_W*S; paddleH=CONFIG.PADDLE_H*S; paddleY=cssH-52*S;

  }
  function brickGeom(){

  function buildBricks(){

    }

  }
  function reset(full){
    layout();
    if(full){ buildBricks(); score=0; lives=CONFIG.LIVES; speedMul=1; brokenCount=0; elapsedMs=0; startMs=0; bursts=[]; crowns=[]; flash=0; popup=null; toastMsg=null; spotIdx=0; spotT=0; spot=people.length?people[0]:null; }
    paddleX=cssW/2; stickBall(); state=full?'start':'playing'; updateHUD();
  }
  function stickBall(){ ballStuck=true; ball.x=paddleX; ball.y=paddleY-ball.size; ball.vx=0; ball.vy=0; }
  function launch(){ if(!ballStuck)return; ballStuck=false; audio();
    const a=(-Math.PI/2)+(Math.random()*0.5-0.25), sp=speed*speedMul;

  function updateHUD(){ const s=document.getElementById('gScore'); if(s)s.textContent=score;
    const b=document.getElementById('gBricks'); if(b)b.textContent=bricksLeft;
    const lv=document.getElementById('gLives'); if(lv){let h='';for(let i=0;i<lives;i++)h+='<i></i>'; lv.innerHTML=h;} }
  function toast(t){ toastMsg={text:t,life:1.4}; }

  function frame(now){ if(!running)return; let dt=(now-lastT)/1000; lastT=now; if(dt>0.05)dt=0.05;
    // 聚光燈輪播：每 SPOT_ROTATE_MS 換下一位排名,讓每個人都輪到被看見
    if(people.length){ spotT+=dt*1000; if(spotT>=CONFIG.SPOT_ROTATE_MS){ spotT=0; spotIdx=(spotIdx+1)%people.length; spot=people[spotIdx]; } }
    if(state==='playing') step(dt); draw(); rafId=requestAnimationFrame(frame); }

  function step(dt){
    if(lastInput==='pointer'&&pointerX!=null) paddleX=pointerX; else paddleX+=keyDir*CONFIG.PADDLE_SPEED*S*dt;
    paddleX=Math.max(paddleW/2,Math.min(cssW-paddleW/2,paddleX));
    if(ballStuck){ ball.x=paddleX; ball.y=paddleY-ball.size; return; }
    const g=brickGeom(), dist=Math.hypot(ball.vx,ball.vy)*dt, maxStep=Math.min(ball.size,g.bh)/2;
    const steps=Math.max(1,Math.ceil(dist/Math.max(2,maxStep)));
    for(let i=0;i<steps;i++){ substep(dt/steps); if(ballStuck)break; }
    if(startMs) elapsedMs=performance.now()-startMs;
  }
  function substep(dt){
    ball.x+=ball.vx*dt; ball.y+=ball.vy*dt; const hs=ball.size/2;
    if(ball.x-hs<0){ball.x=hs;ball.vx=Math.abs(ball.vx);sfxBounce();}
    if(ball.x+hs>cssW){ball.x=cssW-hs;ball.vx=-Math.abs(ball.vx);sfxBounce();}
    if(ball.y-hs<0){ball.y=hs;ball.vy=Math.abs(ball.vy);sfxBounce();}
    if(ball.y-hs>cssH){ loseLife(); return; }
    const pl=paddleX-paddleW/2,pr=paddleX+paddleW/2,pt=paddleY,pb=paddleY+paddleH;
    if(ball.vy>0 && ball.x+hs>pl && ball.x-hs<pr && ball.y+hs>pt && ball.y-hs<pb+hs){
      ball.y=pt-hs; let rel=(ball.x-paddleX)/(paddleW/2); rel=Math.max(-1,Math.min(1,rel));
      const a=rel*CONFIG.MAX_BOUNCE_DEG*Math.PI/180, sp=speed*speedMul;
      ball.vx=sp*Math.sin(a); ball.vy=-sp*Math.cos(a);
      const mv=sp*CONFIG.MIN_VY_RATIO;
      if(Math.abs(ball.vy)<mv){ ball.vy=-mv; ball.vx=Math.sign(ball.vx||1)*Math.sqrt(Math.max(0,sp*sp-mv*mv)); }
      sfxBounce();
    }
    const g=brickGeom();
    for(const br of bricks){ if(!br.alive)continue;
      const bx=g.x0+br.c*(g.bw+g.gap), by=g.top+br.r*(g.bh+g.gap);
      if(ball.x+hs>bx&&ball.x-hs<bx+g.bw&&ball.y+hs>by&&ball.y-hs<by+g.bh){
        const ox=Math.min(ball.x+hs,bx+g.bw)-Math.max(ball.x-hs,bx);
        const oy=Math.min(ball.y+hs,by+g.bh)-Math.max(ball.y-hs,by);
        if(ox<oy){ball.vx=-ball.vx;ball.x+=(ball.x<bx+g.bw/2?-ox:ox);}
        else{ball.vy=-ball.vy;ball.y+=(ball.y<by+g.bh/2?-oy:oy);}
        breakBrick(br,bx,by,g); break;
      }
    }
  }
  function breakBrick(br,bx,by,g){
    br.alive=false; bricksLeft--;
    let pts=CONFIG.ROW_SCORES[br.r]||10; if(br.p.champ) pts*=CONFIG.CHAMP_MULT; score+=pts; brokenCount++;
    if(brokenCount%CONFIG.SPEEDUP_EVERY===0 && speedMul<CONFIG.SPEED_CAP){ speedMul=Math.min(CONFIG.SPEED_CAP,speedMul*CONFIG.SPEEDUP_FACTOR);
      const sp=speed*speedMul,cur=Math.hypot(ball.vx,ball.vy)||1; ball.vx=ball.vx/cur*sp; ball.vy=ball.vy/cur*sp; }
    // 打到誰 → 中央小卡快閃 ＋ 聚光燈插播切到他(之後繼續輪播)
    popup={p:br.p, t:0}; spot=br.p; const si=people.indexOf(br.p); if(si>=0) spotIdx=si; spotT=0;
    if(br.p.champ){ sfxChamp(); flash=1; crowns.push({x:bx+g.bw/2,y:by+g.bh/2,life:1});
      bursts.push({x:bx+g.bw/2,y:by+g.bh/2,text:'+'+pts,life:1.1,color:CONFIG.CHAMP_COLOR,big:true}); }
    else{ sfxBreak(); bursts.push({x:bx+g.bw/2,y:by+g.bh/2,text:'+'+pts,life:1,color:CONFIG.ROW_COLORS[br.r]}); }
    if(bursts.length>24) bursts.shift();
    updateHUD();
    if(bricksLeft<=0){ state='cleared'; sfxClear(); }
  }
  function loseLife(){ lives--; sfxLose();
    if(lives<=0){ lives=CONFIG.LIVES; toast('再接再厲・命補滿，繼續打 💪'); }   // ★ 不結束：補命續打，現場保留
    updateHUD(); stickBall(); }

  // ── 繪圖 ──
  function drawCrown(x,y,s,a,col){ ctx.globalAlpha=a; ctx.fillStyle=col; const u=Math.max(2,round(s/6));
    ctx.fillRect(x-3*u,y+u,6*u,2*u); ctx.fillRect(x-3*u,y-2*u,u,3*u); ctx.fillRect(x-0.5*u,y-3*u,u,4*u); ctx.fillRect(x+2*u,y-2*u,u,3*u);
    ctx.fillStyle='#fff'; ctx.fillRect(x-0.5*u,y-3*u,u,u); ctx.globalAlpha=1; }
  function drawPhoto(p,x,y,rad){ const im=p.photo&&imgCache[p.photo]; ctx.save();
    ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.closePath(); ctx.clip();
    if(im && im.complete && im.naturalWidth>0){ ctx.drawImage(im,x-rad,y-rad,rad*2,rad*2); }
    else{ ctx.fillStyle=p.champ?'#3a2e0a':'#1c2440'; ctx.fillRect(x-rad,y-rad,rad*2,rad*2);
      ctx.fillStyle=p.champ?'#ffd94a':'#8fb0ff'; ctx.font='800 '+round(rad*1.1)+'px "PingFang TC",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText((p.name||'?').slice(0,1),x,y+1); }
    ctx.restore(); ctx.strokeStyle=p.champ?'#ffd94a':'#9fd0ff'; ctx.lineWidth=Math.max(2,3*S); ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.stroke(); }
  function drawSpotCard(p,prog){    // prog:0→1 淡入,>?淡出（小卡快閃,不撐滿螢幕）
    const cw=Math.min(cssW*0.4, CONFIG.POPUP_MAXW), ch=cw*1.02;
    const sc=0.72+0.28*Math.min(1,prog*5), al=prog<0.8?1:(1-(prog-0.8)/0.2);
    const cx=cssW/2, cy=cssH*0.4;
    ctx.save(); ctx.globalAlpha=Math.max(0,al); ctx.translate(cx,cy); ctx.scale(sc,sc);
    const x=-cw/2,y=-ch/2;
    // 光暈
    ctx.fillStyle=p.champ?'rgba(255,217,74,.18)':'rgba(120,170,255,.14)'; ctx.fillRect(x-14,y-14,cw+28,ch+28);
    ctx.fillStyle='rgba(12,14,26,.97)'; ctx.fillRect(x,y,cw,ch);
    ctx.strokeStyle=p.champ?'#ffd94a':'#7ab0ff'; ctx.lineWidth=Math.max(3,4*S); ctx.strokeRect(x+2,y+2,cw-4,ch-4);
    const midX=0; let ty=y+cw*0.1;
    ctx.textAlign='center';
    ctx.fillStyle=p.champ?'#ffd94a':'#9fd0ff'; ctx.font='700 '+round(cw*0.075)+'px "PingFang TC",sans-serif'; ctx.textBaseline='alphabetic';
    ctx.fillText((p.award||'榮譽榜'),midX,ty); ty+=cw*0.02;
    drawPhoto(p,midX,ty+cw*0.2,cw*0.19); ty+=cw*0.44;
    if(p.champ) drawCrown(midX,ty-cw*0.02,cw*0.2,1,'#ffd94a');
    ctx.fillStyle=p.champ?'#ffe08a':'#cfe0ff'; ctx.font='700 '+round(cw*0.06)+'px "PingFang TC",sans-serif';
    ctx.fillText(p.champ?'👑 冠軍 ×3':('第 '+(p.rank||'-')+' 名'),midX,ty+cw*0.06); ty+=cw*0.14;
    ctx.fillStyle='#fff'; ctx.font='900 '+round(cw*0.13)+'px "PingFang TC",sans-serif'; ctx.fillText(p.name,midX,ty+cw*0.06); ty+=cw*0.17;
    if(p.val){ ctx.fillStyle=p.champ?'#ffd94a':'#bcd8ff'; ctx.font='800 '+round(cw*0.09)+'px "PingFang TC",sans-serif'; ctx.fillText(p.val,midX,ty+cw*0.02); }
    ctx.restore();
  }
  function drawMiniCard(p){         // 右上「榜單聚光燈」輪播(每個排名輪流被看見)
    const w=Math.min(168*Math.max(1,S),cssW*0.46), h=w*0.52, x=cssW-w-12, y=76*S;
    ctx.fillStyle='rgba(10,12,24,.82)'; ctx.fillRect(x,y,w,h);
    ctx.strokeStyle=p.champ?'#ffd94a':'#6fa0ff'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,w-2,h-2);
    drawPhoto(p,x+h*0.5,y+h*0.5,h*0.32);
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillStyle='#9fb0d0'; ctx.font='600 '+round(w*0.072)+'px "PingFang TC",sans-serif';
    ctx.fillText((p.award||'榜單')+'・'+(p.champ?'冠軍':'第'+(p.rank||'-')+'名'), x+h+6, y+h*0.26);
    ctx.fillStyle='#fff'; ctx.font='800 '+round(w*0.115)+'px "PingFang TC",sans-serif'; ctx.fillText(p.name.slice(0,5), x+h+6, y+h*0.56);
    if(p.val){ ctx.fillStyle=p.champ?'#ffd94a':'#bcd8ff'; ctx.font='700 '+round(w*0.082)+'px "PingFang TC",sans-serif'; ctx.fillText(p.val.slice(0,8), x+h+6, y+h*0.82); }
  }
  function draw(){
    ctx.clearRect(0,0,cssW,cssH);   // ★ 透明:榜單從後面透出來(不再蓋黑)
    // 星點背景
    const g=brickGeom();
    for(const br of bricks){ if(!br.alive)continue;
      const bx=snap(g.x0+br.c*(g.bw+g.gap)),by=snap(g.top+br.r*(g.bh+g.gap)),bw=snap(g.bw),bh=snap(g.bh);
      ctx.fillStyle=br.p.champ?CONFIG.CHAMP_COLOR:CONFIG.ROW_COLORS[br.r]; ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle='rgba(255,255,255,.28)'; ctx.fillRect(bx,by,bw,PS);
      ctx.fillStyle='rgba(0,0,0,.24)'; ctx.fillRect(bx,by+bh-PS,bw,PS);
      if(br.p.champ){ ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=Math.max(1,PS/2); ctx.strokeRect(bx+1,by+1,bw-2,bh-2); }
      if(bw>26){ ctx.fillStyle='rgba(12,10,22,.92)'; ctx.font='700 '+Math.max(9,round(bh*0.42))+'px "PingFang TC",sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText((br.p.name||'').slice(0,4),bx+bw/2,by+bh/2+1); }
    }
    for(let i=crowns.length-1;i>=0;i--){ const c=crowns[i]; c.life-=0.018; c.y-=1.6; if(c.life<=0){crowns.splice(i,1);continue;} drawCrown(c.x,c.y,34*S,Math.max(0,c.life),'#ffd94a'); }
    for(let i=bursts.length-1;i>=0;i--){ const b=bursts[i]; b.life-=0.028; b.y-=1.1; if(b.life<=0){bursts.splice(i,1);continue;}
      ctx.globalAlpha=Math.max(0,Math.min(1,b.life)); ctx.fillStyle=b.color; ctx.font='800 '+round((b.big?18:13)*S)+'px "PingFang TC",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(b.text,b.x,b.y); ctx.globalAlpha=1; }
    // 擋板 + 球
    ctx.fillStyle=CONFIG.PADDLE_COLOR; ctx.fillRect(snap(paddleX-paddleW/2),snap(paddleY),snap(paddleW),snap(paddleH));
    ctx.fillStyle=CONFIG.BALL_COLOR; ctx.fillRect(snap(ball.x-ball.size/2),snap(ball.y-ball.size/2),ball.size,ball.size);
    if(spot) drawMiniCard(spot);
    // 中央彈卡
    if(popup){ popup.t+=16/CONFIG.POPUP_MS; if(popup.t>=1){ popup=null; } else drawSpotCard(popup.p,popup.t); }
    if(flash>0){ ctx.fillStyle='rgba(255,240,180,'+(flash*0.32)+')'; ctx.fillRect(0,0,cssW,cssH); flash-=0.06; }
    if(toastMsg){ toastMsg.life-=0.02; if(toastMsg.life<=0) toastMsg=null; else{ ctx.globalAlpha=Math.min(1,toastMsg.life);
      ctx.fillStyle='#ffd35c'; ctx.font='800 '+round(18*S)+'px "PingFang TC",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(toastMsg.text,cssW/2,cssH*0.66); ctx.globalAlpha=1; } }
    if(state==='start') overlay('像素打磚塊 · 榜單英雄大亂鬥','打磚塊→中央彈出那位英雄的卡片・金磚＝冠軍(3倍分+加冕)\n空白鍵 / 點擊 發球開始',null);
    else if(state==='playing'&&ballStuck) hintLaunch();
    else if(state==='cleared') overlay('CLEAR!','分數 '+score+'　時間 '+fmtTime(elapsedMs),'再玩一次');
  }
  function hintLaunch(){ ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font='700 '+round(14*S)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('空白鍵 / 點擊 發球',cssW/2,paddleY-30*S); }
  function overlay(t,sub,btn){ ctx.fillStyle='rgba(3,4,12,.5)'; ctx.fillRect(0,0,cssW,cssH); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#fff'; ctx.font='900 '+round(30*S)+'px "PingFang TC",sans-serif'; ctx.fillText(t,cssW/2,cssH*0.34);
    ctx.fillStyle='#cfd6ee'; ctx.font='600 '+round(13*S)+'px "PingFang TC",sans-serif';
    (sub||'').split('\n').forEach((ln,i)=>ctx.fillText(ln,cssW/2,cssH*0.44+i*round(21*S)));
    if(btn){ const bw=round(160*S),bh=round(44*S),bx=cssW/2-bw/2,by=cssH*0.6; ctx.fillStyle='#ffd35c'; ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle='#1a1a1a'; ctx.font='800 '+round(16*S)+'px "PingFang TC",sans-serif'; ctx.fillText(btn,cssW/2,by+bh/2); _btnRect={x:bx,y:by,w:bw,h:bh}; } else _btnRect=null; }
  function fmtTime(ms){ const s=Math.floor(ms/1000); return s<60?s+' 秒':Math.floor(s/60)+' 分 '+(s%60)+' 秒'; }

  function primaryAction(){ if(state==='cleared'){ reset(true); return; } if(state==='start'){ state='playing'; launch(); return; } if(state==='playing'&&ballStuck){ launch(); } }
  function pointerPos(e){ const r=cv.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left; return cx*(cssW/(r.width||cssW)); }
  function pointerYf(e){ const r=cv.getBoundingClientRect(); const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top; return cy*(cssH/(r.height||cssH)); }
  function onKey(e){ if(!running)return; if(['ArrowLeft','ArrowRight','a','A','d','D',' '].includes(e.key)) e.preventDefault();
    if(e.type==='keydown'){ lastInput='key'; if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keyDir=-1; else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keyDir=1; else if(e.key===' ')primaryAction(); }
    else{ if((e.key==='ArrowLeft'||e.key==='a'||e.key==='A')&&keyDir===-1)keyDir=0; if((e.key==='ArrowRight'||e.key==='d'||e.key==='D')&&keyDir===1)keyDir=0; } }
  function onMouseMove(e){ lastInput='pointer'; pointerX=pointerPos(e); }
  function onDown(e){ e.preventDefault(); const px=pointerPos(e),py=pointerYf(e); lastInput='pointer'; pointerX=px;
    if(_btnRect&&px>=_btnRect.x&&px<=_btnRect.x+_btnRect.w&&py>=_btnRect.y&&py<=_btnRect.y+_btnRect.h){ primaryAction(); return; } primaryAction(); }
  function onMove(e){ e.preventDefault(); lastInput='pointer'; pointerX=pointerPos(e); }
  let _bound=false;
  function bind(){ if(_bound)return; _bound=true;
    window.addEventListener('keydown',onKey); window.addEventListener('keyup',onKey);
    cv.addEventListener('mousemove',onMouseMove); cv.addEventListener('mousedown',onDown);
    cv.addEventListener('touchstart',onDown,{passive:false}); cv.addEventListener('touchmove',onMove,{passive:false});
    window.addEventListener('resize',onResize);
    window.addEventListener('wheel',pauseScroll,{passive:true});   // 手動滑就暫停自動捲
  }
  function onResize(){ if(!running)return; const ow=cssW,oh=cssH; layout(); const kx=cssW/ow,ky=cssH/oh; paddleX*=kx; ball.x*=kx; ball.y*=ky; if(ballStuck)stickBall(); }

  // ── 後面榜單自動緩慢上下捲動：每位排名都被輪到、有被嘉許的感覺 ──
  let asRAF=null, pauseUntil=0, sDir=1, scrollPos=0;
  const SCROLL_SPEED=0.6;   // 每幀位移(px);越大越快
  function autoScroll(){
    if(!running){ asRAF=null; return; }
    if(performance.now()>pauseUntil){
      const max=Math.max(0,(document.documentElement.scrollHeight||0)-window.innerHeight);
      if(max>12){ scrollPos+=SCROLL_SPEED*sDir; if(scrollPos>=max){scrollPos=max;sDir=-1;} if(scrollPos<=0){scrollPos=0;sDir=1;} window.scrollTo(0,scrollPos); }
    } else { scrollPos=(window.scrollY||window.pageYOffset||0); }   // 手動捲動期間跟著使用者
    asRAF=requestAnimationFrame(autoScroll);
  }
  function pauseScroll(){ pauseUntil=performance.now()+3500; }

  function start(){ bind(); running=true; setTimeout(()=>{reset(true);},30); lastT=performance.now();
    cancelAnimationFrame(rafId); rafId=requestAnimationFrame(frame);
    sDir=1; pauseUntil=0; scrollPos=(window.scrollY||window.pageYOffset||0); cancelAnimationFrame(asRAF); asRAF=requestAnimationFrame(autoScroll); }
  function stop(){ running=false; cancelAnimationFrame(rafId); cancelAnimationFrame(asRAF); asRAF=null; }
  return { start, stop, isRunning:()=>running };
})();

// ── 開/關（預設直接玩；✕ 關掉回純榜單；🎮 重開）──
function openGame(){
  const sec=document.getElementById('gameSection'); if(!sec) return;
  sec.style.display='block'; document.body.classList.add('game-open');
  // ★ 關掉平滑捲動＋吸附,否則會跟「每幀自動捲動」打架導致背景不動
  try{ document.documentElement.style.scrollBehavior='auto'; document.documentElement.style.scrollSnapType='none'; }catch(e){}
  setTimeout(()=>{ try{ GAME.start(); }catch(e){} }, 40);
}
function closeGame(){
  const sec=document.getElementById('gameSection'); if(!sec) return;
  try{ GAME.stop(); }catch(e){} sec.style.display='none'; document.body.classList.remove('game-open');
  try{ document.documentElement.style.scrollBehavior=''; document.documentElement.style.scrollSnapType=''; }catch(e){}
}
function toggleGame(){ (document.getElementById('gameSection')||{}).style && document.getElementById('gameSection').style.display==='block' ? closeGame() : openGame(); }
// ★ 預設直接玩：進頁面就自動開遊戲（右上 ✕ 可關回純榜單）
setTimeout(function(){ try{ if(document.querySelector('#main .king-card')) openGame(); }catch(e){} }, 250);
</script>
